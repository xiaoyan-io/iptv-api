<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Myanmar Sports IPTV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#e94560;--accent2:#0f3460;--text:#eee;--text2:#aaa;--border:#2a2a4a;--success:#2ecc71;--radius:10px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:0;min-height:100vh;font-size:14px;line-height:1.5}
.container{max-width:800px;margin:0 auto;padding:12px}

/* header */
.header{background:linear-gradient(135deg,var(--accent2),var(--bg));padding:20px 16px;text-align:center;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:100}
.header h1{font-size:20px;margin-bottom:4px;letter-spacing:1px}
.header .subtitle{font-size:12px;color:var(--text2)}
.lang-bar{display:flex;justify-content:center;gap:6px;margin-top:8px}
.lang-btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:4px 12px;border-radius:16px;font-size:11px;cursor:pointer;transition:.2s}
.lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* stats bar */
.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.stat-card{flex:1;min-width:80px;background:var(--card);border-radius:var(--radius);padding:10px;text-align:center;border:1px solid var(--border)}
.stat-card .num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:10px;color:var(--text2);margin-top:2px}

/* url cards */
.url-section{margin:12px 0}
.url-section h3{font-size:13px;color:var(--text2);margin-bottom:6px;padding-left:4px}
.url-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.url-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.url-card .label{font-size:11px;color:var(--text2);white-space:nowrap}
.url-card .url{font-size:10px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.copy-btn{background:var(--accent2);border:none;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap;transition:.2s}
.copy-btn:active{transform:scale(.95)}
.copy-btn.copied{background:var(--success)}
.copy-btn.small{padding:3px 8px;font-size:10px}

/* search */
.search-box{width:100%;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none;margin:8px 0 12px;transition:.2s}
.search-box:focus{border-color:var(--accent)}

/* groups */
.group{margin-bottom:12px}
.group-header{background:var(--card);padding:8px 12px;border-radius:var(--radius) var(--radius) 0 0;font-size:13px;font-weight:600;color:var(--accent);border-left:3px solid var(--accent);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.group-header .count{font-size:11px;color:var(--text2);font-weight:400}
.channel-list{list-style:none;background:var(--card);border-radius:0 0 var(--radius) var(--radius);margin-bottom:1px;overflow:hidden}
.channel-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;transition:.1s}
.channel-item:last-child{border-bottom:none}
.channel-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.channel-item .count-badge{background:var(--accent2);color:var(--text2);padding:2px 8px;border-radius:10px;font-size:10px;margin:0 6px;white-space:nowrap}
.channel-item .test-btn{padding:3px 8px;font-size:10px;white-space:nowrap}

/* empty */
.empty{text-align:center;padding:30px 16px;color:var(--text2);font-size:14px}

/* footer */
.footer{text-align:center;padding:20px;font-size:11px;color:var(--text2);border-top:1px solid var(--border);margin-top:16px}
.footer a{color:var(--accent);text-decoration:none}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:8px 20px;border-radius:20px;font-size:13px;border:1px solid var(--border);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:480px){
  .url-grid{grid-template-columns:1fr}
  .stats{gap:6px}
  .stat-card{padding:8px}
  .stat-card .num{font-size:18px}
  .header h1{font-size:17px}
}
</style>
</head>
<body>

<div class="header">
  <h1 id="title">Myanmar Sports IPTV</h1>
  <div class="subtitle" data-i18n="subtitle">Sports channels for Myanmar · မြန်မာနိုင်ငံအတွက် အားကစားချန်နယ်များ</div>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="zh">中文</button>
    <button class="lang-btn" data-lang="en">English</button>
    <button class="lang-btn" data-lang="my">မြန်မာ</button>
  </div>
</div>

<div class="container">
  <div class="stats" id="stats">
    <div class="stat-card"><div class="num" id="totalChannels">0</div><div class="label" data-i18n="channels">Channels</div></div>
    <div class="stat-card"><div class="num" id="totalGroups">0</div><div class="label" data-i18n="groups">Groups</div></div>
    <div class="stat-card"><div class="num" id="updateTime">-</div><div class="label" data-i18n="updated">Updated</div></div>
  </div>

  <div class="url-section" id="urlSection">
    <h3 data-i18n="playlist_urls">Playlist URLs</h3>
    <div class="url-grid" id="urlGrid"></div>
  </div>

  <input type="text" class="search-box" id="searchInput" data-i18n-placeholder="search" placeholder="🔍 Search channels...">

  <div id="groups"></div>
  <div class="empty" id="empty" style="display:none" data-i18n="no_results">No channels found</div>
</div>

<div class="footer">
  <span data-i18n="powered">Powered by</span> <a href="https://github.com/netio896/iptv-api" target="_blank">IPTV-API</a>
</div>

<div class="toast" id="toast"></div>

<script>
const I18N = {
  zh: {
    title:'Myanmar Sports IPTV', subtitle:'Sports channels for Myanmar · မြန်မာနိုင်ငံအတွက် အားကစားချန်နယ်များ',
    channels:'Channels', groups:'Groups', updated:'Updated',
    playlist_urls:'Playlist URLs', search:'🔍 Search channels...', no_results:'No channels found',
    powered:'Powered by', copy:'Copy', copied:'Copied!', test:'Test',
    txt_f:'TXT', m3u_f:'M3U', epg_f:'EPG', lines:'lines'
  },
  en: {
    title:'Myanmar Sports IPTV', subtitle:'Sports channels for Myanmar',
    channels:'Channels', groups:'Groups', updated:'Updated',
    playlist_urls:'Playlist URLs', search:'🔍 Search channels...', no_results:'No channels found',
    powered:'Powered by', copy:'Copy', copied:'Copied!', test:'Test',
    txt_f:'TXT', m3u_f:'M3U', epg_f:'EPG', lines:'lines'
  },
  my: {
    title:'မြန်မာ အားကစား IPTV', subtitle:'မြန်မာနိုင်ငံအတွက် အားကစားချန်နယ်များ',
    channels:'လိုင်းများ', groups:'အုပ်စုများ', updated:'နောက်ဆုံးထွက်',
    playlist_urls:'လိပ်စာများ', search:'🔍 ရှာဖွေရန်...', no_results:'မတွေ့ပါ',
    powered:'မှပံ့ပိုးသည်', copy:'ကူးယူ', copied:'ကူးယူပြီး!', test:'စမ်းကြည့်',
    txt_f:'TXT', m3u_f:'M3U', epg_f:'EPG', lines:'လိုင်း'
  }
};

let lang = 'zh';
let allData = {updated_at:'', total_channels:0, total_groups:0, groups:[], channels:[]};
let urlsData = {};

function _(key){ return I18N[lang]?.[key] || I18N['zh'][key] || key; }
function setPlaceholders(l){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = _(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const k = el.dataset.i18nPlaceholder;
    el.placeholder = _(k) || el.placeholder;
  });
  document.getElementById('title').textContent = _('title');
}
function applyLang(l){
  lang = l;
  setPlaceholders(l);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  render();
}
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    showToast(_('copied'));
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast(_('copied'));
  }
}

function renderUrls(){
  const grid = document.getElementById('urlGrid');
  const entries = [
    {label:_('txt_f') + ' TXT', url: urlsData.txt, type:'txt'},
    {label:_('m3u_f') + ' M3U', url: urlsData.m3u, type:'m3u'},
    {label:_('epg_f') + ' EPG', url: urlsData.epg, type:'epg'},
    {label:'IPv4 TXT', url: urlsData.ipv4_txt, type:'txt'},
    {label:'IPv4 M3U', url: urlsData.ipv4_m3u, type:'m3u'},
  ].filter(e => e.url);
  grid.innerHTML = entries.map(e => `
    <div class="url-card">
      <span class="label">${e.label}</span>
      <span class="url">${e.url.replace(/^https?:\/\//,'')}</span>
      <button class="copy-btn small" onclick='copyText("${e.url}")'>${_('copy')}</button>
    </div>
  `).join('');
}

function render(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('groups');
  const empty = document.getElementById('empty');
  const totalCh = document.getElementById('totalChannels');
  const totalGr = document.getElementById('totalGroups');
  const updEl = document.getElementById('updateTime');

  totalCh.textContent = allData.total_channels || '0';
  totalGr.textContent = allData.total_groups || '0';
  updEl.textContent = allData.updated_at ? allData.updated_at.replace(/更新时间[：:]/g,'').trim() : '-';

  if(!allData.groups || allData.groups.length === 0){
    container.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = _('no_results');
    return;
  }
  empty.style.display = 'none';

  let filteredGroups = [];
  let totalFiltered = 0;

  if(q){
    for(const g of allData.groups){
      const filtered = g.channels.filter(c => {
        const n = (c.name || '').toLowerCase();
        const u = (c.url || '').toLowerCase();
        return n.includes(q) || u.includes(q);
      });
      if(filtered.length > 0){
        filteredGroups.push({group: g.group, channels: filtered});
        totalFiltered += filtered.length;
      }
    }
    totalCh.textContent = totalFiltered;
    totalGr.textContent = filteredGroups.length;
  } else {
    filteredGroups = allData.groups;
    totalFiltered = allData.total_channels;
  }

  container.innerHTML = filteredGroups.map(g => `
    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        <span>${g.group}</span>
        <span class="count">${g.channels.length}</span>
      </div>
      <ul class="channel-list">
        ${g.channels.slice(0,200).map(c => `
          <li class="channel-item">
            <span class="name">${c.name}</span>
            <button class="copy-btn small test-btn" onclick='copyText("${c.url}")'>${_('copy')}</button>
          </li>
        `).join('')}
        ${g.channels.length > 200 ? `<li class="channel-item"><span class="name" style="color:var(--text2);font-size:11px;">... +${g.channels.length-200} more</span></li>` : ''}
      </ul>
    </div>
  `).join('');
}

function toggleGroup(el){
  const list = el.nextElementSibling;
  if(list) list.style.display = list.style.display === 'none' ? '' : 'none';
}

async function loadData(){
  try {
    const [statusRes, channelsRes] = await Promise.all([
      fetch('/api/sports/status'),
      fetch('/api/sports/channels')
    ]);
    const status = await statusRes.json();
    const channels = await channelsRes.json();

    urlsData = {
      txt: status.txt_url || '',
      m3u: status.m3u_url || '',
      epg: status.epg_url || '',
      ipv4_txt: status.ipv4_txt_url || '',
      ipv4_m3u: status.ipv4_m3u_url || '',
    };

    allData = {
      updated_at: channels.updated_at || status.updated_at || '',
      total_channels: channels.total_channels || 0,
      total_groups: channels.total_groups || 0,
      groups: channels.groups || [],
      channels: channels.channels || [],
    };

    renderUrls();
    render();
  } catch(e){
    console.error('Failed to load sports data:', e);
    document.getElementById('groups').innerHTML = '<div class="empty">Failed to load. Make sure IPTV-API has run at least once with the sports config.</div>';
  }
}

document.getElementById('searchInput').addEventListener('input', render);

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
