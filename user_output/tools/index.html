<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<title>AI 追问工具箱 · 建筑/M&E/通用</title>
<style>
:root {
  --bg: #f5f5f7; --surface: #ffffff; --surface2: #f0f0f2;
  --text: #1a1a2e; --text2: #555; --text3: #888;
  --primary: #1a73e8; --primary-light: #e8f0fe;
  --accent-arch: #f97316; --accent-elec: #eab308; --accent-plumb: #06b6d4;
  --accent-hvac: #3b82f6; --accent-boq: #8b5cf6; --accent-cost: #10b981;
  --accent-constr: #ef4444; --accent-qa: #14b8a6;
  --accent-newbie: #0369a1; --accent-expert: #7c3aed; --accent-ao: #db2777;
  --accent-universal: #0891b2; --accent-beginner: #d97706;
  --accent-data: #059669; --accent-writing: #d97706; --accent-decision: #7c3aed;
  --accent-learn: #0284c7; --accent-reverse: #dc2626;
  --border: #e0e0e4; --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.10); --radius: 16px; --radius-sm: 10px; --radius-xs: 8px;
  --nav-height: 60px; --header-height: 52px; --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}
.dark {
  --bg: #12121a; --surface: #1c1c28; --surface2: #252535;
  --text: #e8e8f0; --text2: #b0b0bb; --text3: #777788;
  --primary: #5b9cf5; --primary-light: #1e2a3d; --border: #2a2a38;
  --shadow: 0 1px 3px rgba(0,0,0,0.3); --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;max-width:500px;margin:0 auto;
  position:relative;overflow-x:hidden;line-height:1.5;
  transition:background var(--transition),color var(--transition);
  padding-bottom:calc(var(--nav-height)+20px);-webkit-font-smoothing:antialiased;user-select:none;
}
.app-header{
  position:sticky;top:0;z-index:100;
  background:var(--surface);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);height:var(--header-height);
  transition:background var(--transition),border var(--transition);
}
.app-title{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.theme-toggle{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface2);cursor:pointer;font-size:1.2rem;
  display:flex;align-items:center;justify-content:center;transition:all var(--transition);color:var(--text);
}
.view{display:none;padding:12px 14px;animation:fadeSlideIn .25s ease}
.view.active{display:block}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:500px;background:var(--surface);
  border-top:1px solid var(--border);display:flex;align-items:center;
  overflow-x:auto;white-space:nowrap;padding:4px 2px;
  padding-bottom:max(4px,env(safe-area-inset-bottom));
  height:var(--nav-height);z-index:100;
  box-shadow:0 -2px 12px rgba(0,0,0,0.04);
  transition:background var(--transition),border var(--transition);
  scrollbar-width:none;-ms-overflow-style:none;
}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;padding:4px 8px;border-radius:10px;font-size:.6rem;
  color:var(--text3);font-weight:500;min-width:44px;transition:all var(--transition);
}
.nav-item .nav-icon{font-size:1.2rem}
.nav-item.active{color:var(--primary);font-weight:600}
.nav-badge{
  position:absolute;top:0;right:2px;background:#ef4444;color:#fff;
  font-size:.5rem;width:14px;height:14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;display:none;
}
.nav-badge.show{display:flex}
.card{
  background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;
  box-shadow:var(--shadow);border:1px solid var(--border);transition:all var(--transition);
  cursor:pointer;position:relative;
}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.card-title{font-weight:600;font-size:.95rem}
.card-subtitle{font-size:.75rem;color:var(--text2)}
.btn{
  padding:8px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface2);cursor:pointer;font-size:.75rem;font-weight:500;
  transition:all var(--transition);display:inline-flex;align-items:center;gap:5px;
  color:var(--text);font-family:inherit;white-space:nowrap;
}
.btn.primary{background:var(--primary);color:#fff;border:none}
.btn.saved{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.dark .btn.saved{background:#3d2e0a;border-color:#b45309;color:#fcd34d}
.btn-sm{padding:5px 10px;font-size:.7rem;border-radius:14px}
.btn-follow{background:#ede9fe;border-color:#a78bfa;color:#5b21b6}
.dark .btn-follow{background:#2e1a4a;border-color:#7c3aed;color:#c4b5fd}
.prompt-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xs);padding:12px;margin-bottom:6px;transition:all var(--transition)}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-input{
  flex:1;padding:10px 16px;border-radius:24px;border:1.5px solid var(--border);
  background:var(--surface);font-size:.9rem;outline:none;color:var(--text);
  transition:all var(--transition);user-select:text;-webkit-user-select:text;
}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.chip{
  padding:6px 12px;border-radius:18px;border:1.5px solid var(--border);
  cursor:pointer;font-size:.7rem;font-weight:500;background:var(--surface);
  color:var(--text2);transition:all var(--transition);
}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.collapse-header{
  display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;
  font-weight:600;font-size:.9rem;border:1px solid var(--border);margin-bottom:4px;
}
.collapse-content{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 4px}
.collapse-content.open{max-height:2000px}
.collapse-arrow{transition:transform .3s;font-size:.8rem;color:var(--text3)}
.collapse-header.open .collapse-arrow{transform:rotate(180deg)}
.trouble-item,.newbie-step{
  display:flex;align-items:center;gap:10px;padding:12px;
  border-radius:var(--radius-xs);border:1px solid var(--border);
  margin-bottom:6px;background:var(--surface);transition:all var(--transition);
}
.trouble-item label{flex:1;font-size:.8rem;user-select:text}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:24px;
  font-size:.8rem;z-index:200;opacity:0;pointer-events:none;
  transition:all .3s ease;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dark .toast{background:#e8e8f0;color:#1a1a2e}
.accent-arch{background:#fff7ed;color:#c2410c}.dark .accent-arch{background:#2d1a0a;color:#fb923c}
.accent-elec{background:#fefce8;color:#a16207}.dark .accent-elec{background:#2d2506;color:#facc15}
.accent-plumb{background:#ecfeff;color:#0e7490}.dark .accent-plumb{background:#0a2025;color:#22d3ee}
.accent-hvac{background:#eff6ff;color:#1d4ed8}.dark .accent-hvac{background:#0a1628;color:#60a5fa}
.accent-boq{background:#f5f3ff;color:#6d28d9}.dark .accent-boq{background:#1a0f2e;color:#a78bfa}
.accent-cost{background:#ecfdf5;color:#047857}.dark .accent-cost{background:#0a1f18;color:#34d399}
.accent-constr{background:#fef2f2;color:#b91c1c}.dark .accent-constr{background:#2d0a0a;color:#f87171}
.accent-qa{background:#f0fdfa;color:#0f766e}.dark .accent-qa{background:#0a1f1c;color:#2dd4bf}
.accent-newbie{background:#f0f9ff;color:#0369a1}.dark .accent-newbie{background:#0c1a2b;color:#38bdf8}
.accent-expert{background:#f5f3ff;color:#6d28d9}.dark .accent-expert{background:#1a0f2e;color:#a78bfa}
.accent-universal{background:#ecfeff;color:#0e7490}.dark .accent-universal{background:#0a2025;color:#22d3ee}
.accent-beginner{background:#fff7ed;color:#c2410c}.dark .accent-beginner{background:#2d1a0a;color:#fb923c}
.accent-ao{background:#fdf2f8;color:#be185d}.dark .accent-ao{background:#2d0a1a;color:#f472b6}
.accent-data{background:#ecfdf5;color:#047857}.dark .accent-data{background:#0a1f18;color:#34d399}
.accent-writing{background:#fff7ed;color:#c2410c}.dark .accent-writing{background:#2d1a0a;color:#fb923c}
.accent-decision{background:#f5f3ff;color:#6d28d9}.dark .accent-decision{background:#1a0f2e;color:#a78bfa}
.accent-learn{background:#f0f9ff;color:#0369a1}.dark .accent-learn{background:#0c1a2b;color:#38bdf8}
.accent-reverse{background:#fef2f2;color:#b91c1c}.dark .accent-reverse{background:#2d0a0a;color:#f87171}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-title"><span>🧰</span> AI 追问工具箱</div>
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
</header>
<div class="toast" id="toast"></div>

<div class="view active" id="view-dashboard"></div>
<div class="view" id="view-prompts"></div>
<div class="view" id="view-newbie"></div>
<div class="view" id="view-saved"></div>
<div class="view" id="view-troubleshoot"></div>
<div class="view" id="view-settings"></div>

<nav class="bottom-nav">
  <div class="nav-item active" data-view="dashboard"><span class="nav-icon">🏠</span>首页</div>
  <div class="nav-item" data-view="prompts"><span class="nav-icon">📂</span>追问库</div>
  <div class="nav-item" data-view="newbie"><span class="nav-icon">🚀</span>新手</div>
  <div class="nav-item" data-view="saved"><span class="nav-icon">⭐</span>收藏<span class="nav-badge" id="savedBadge">0</span></div>
  <div class="nav-item" data-view="troubleshoot"><span class="nav-icon">🔍</span>排查</div>
  <div class="nav-item" data-view="settings"><span class="nav-icon">⚙️</span>设置</div>
</nav>

<script>
(function(){
  // ────────── 合并后的数据定义 ──────────
  const categoryMeta = {
    arch:     { name:'🏠 建筑设计',       icon:'🏠', accent:'accent-arch' },
    elec:     { name:'⚡ 电气设计',       icon:'⚡', accent:'accent-elec' },
    plumb:    { name:'💧 给排水',         icon:'💧', accent:'accent-plumb' },
    hvac:     { name:'❄️ 空调 HVAC',     icon:'❄️', accent:'accent-hvac' },
    boq:      { name:'📊 BOQ',           icon:'📊', accent:'accent-boq' },
    cost:     { name:'💰 成本分析',       icon:'💰', accent:'accent-cost' },
    constr:   { name:'🚧 施工 Review',   icon:'🚧', accent:'accent-constr' },
    qa:       { name:'✅ Final QA',       icon:'✅', accent:'accent-qa' },
    beginner: { name:'📐 新手平面图',     icon:'📐', accent:'accent-beginner' },
    expert:   { name:'🔧 M&E 专家追问',  icon:'🔧', accent:'accent-expert' },
    universal:{ name:'💬 万能追问',       icon:'💬', accent:'accent-universal' },
    ao:       { name:'🤖 多智能体 ao',   icon:'🤖', accent:'accent-ao' },
    data:     { name:'📊 数据分析',       icon:'📊', accent:'accent-data' },
    writing:  { name:'✍️ 写作润色',       icon:'✍️', accent:'accent-writing' },
    decision: { name:'🎯 决策辅助',       icon:'🎯', accent:'accent-decision' },
    learn:    { name:'📚 学习辅助',       icon:'📚', accent:'accent-learn' },
    reverse:  { name:'🔄 逆向思维',       icon:'🔄', accent:'accent-reverse' },
  };

  const promptsData = {
    // ── 原 M&E Toolbox 8 个分类 ──
    arch: [
      { id:'arch-1', title:'空间优化分析', text:'请分析以下建筑平面图的空间利用效率，提出优化建议。关注房间比例、走道浪费、储物空间等问题。' },
      { id:'arch-2', title:'动线分析', text:'对该建筑进行人流动线分析，评估功能分区的合理性，指出动线交叉、折返过多等问题。' },
      { id:'arch-3', title:'湿区检查', text:'检查所有湿区的防水设计、坡度、排水点位，评估干湿分离方案的可行性。' },
      { id:'arch-4', title:'楼梯合规检查', text:'根据当地规范检查楼梯的踏步高宽比、净空高度、扶手高度是否合规。' },
      { id:'arch-5', title:'自然通风与采光', text:'评估自然通风和采光条件，确认门窗位置是否形成有效的空气对流。' },
      { id:'arch-6', title:'家具布置优化', text:'基于空间尺寸，给出家具布置优化方案，确保过道宽度和功能区域合理。' },
      { id:'arch-7', title:'无障碍设计检查', text:'全面检查无障碍设计，包括入口坡道、电梯尺寸、卫生间无障碍设施等。' },
    ],
    elec: [
      { id:'elec-1', title:'灯光设计优化', text:'优化灯光布局，包括照度计算、灯具选型、分区控制和应急照明布置。' },
      { id:'elec-2', title:'插座布局检查', text:'检查插座布局是否满足功能需求，避免插座被家具遮挡、位置不合理等问题。' },
      { id:'elec-3', title:'DB配电箱Review', text:'审查配电箱设计，包括回路分配、MCB选型、备用回路预留等。' },
      { id:'elec-4', title:'MCB配置检查', text:'检查MCB额定电流选型是否与负载匹配，是否满足选择性配合要求。' },
      { id:'elec-5', title:'RCCB漏电保护', text:'确认漏电保护配置是否符合规范，各回路的RCCB额定剩余动作电流选择是否合理。' },
      { id:'elec-6', title:'SPD防雷设计', text:'检查浪涌保护器配置，根据防雷等级确定SPD的型号和安装位置。' },
      { id:'elec-7', title:'接地系统设计', text:'审查接地系统，包括接地极型式、接地电阻要求、MEB等电位联结。' },
      { id:'elec-8', title:'电缆尺寸计算', text:'根据负载电流、敷设方式和环境温度计算电缆截面，确保载流量满足要求。' },
      { id:'elec-9', title:'电压降校验', text:'校验末端回路电压降是否在允许范围内（通常不超过3%），建议增大电缆截面。' },
    ],
    plumb: [
      { id:'plumb-1', title:'给水管网设计', text:'审查给水管网设计，包括管径选择、用水点分布、水压计算和水泵选型。' },
      { id:'plumb-2', title:'排水系统检查', text:'检查排水系统坡度是否满足规范、通气管设置是否合理、排水点位布局。' },
      { id:'plumb-3', title:'雨水排放设计', text:'审查雨水排放系统，包括雨水斗布置、立管管径和排水出路。' },
    ],
    hvac: [
      { id:'hvac-1', title:'空调负荷计算', text:'逐项进行冷热负荷计算（外墙、窗户、人员、设备、新风），确认空调机组选型合理。' },
      { id:'hvac-2', title:'风管系统设计', text:'审查风管系统，包括风管尺寸、风速控制、静压箱布置和保温要求。' },
      { id:'hvac-3', title:'新风系统检查', text:'确认新风量满足 ASHRAE/GB 标准，检查新风取风口位置是否污染源。' },
      { id:'hvac-4', title:'排烟系统设计', text:'检查消防排烟系统，包括排烟量计算、排烟口位置和补风方案。' },
    ],
    boq: [
      { id:'boq-1', title:'工程量清单审核', text:'审核BOQ的完整性，核对各专业工程量是否与图纸一致，排查漏项和重复计量的情况。' },
      { id:'boq-2', title:'材料规格核对', text:'核对材料规格是否与设计图纸、技术规范书一致，检查是否存在不合理的替代方案。' },
    ],
    cost: [
      { id:'cost-1', title:'成本估算分析', text:'进行详细的成本估算，包括人工、材料、设备和管理费用，给出投资概算。' },
      { id:'cost-2', title:'Value Engineering', text:'价值工程分析，从功能/成本角度提出降低造价的替代方案，但不牺牲核心功能。' },
      { id:'cost-3', title:'生命周期成本', text:'分析全生命周期成本，涵盖初始投资、运维费用、能耗成本和更换成本。' },
    ],
    constr: [
      { id:'constr-1', title:'返工风险识别', text:'基于墨菲定律识别施工中最可能出现的返工风险场景及预防措施。' },
      { id:'constr-2', title:'施工可行性审查', text:'审查施工方案的可行性，评估施工顺序、交叉作业和临时设施配置。' },
      { id:'constr-3', title:'材料优化建议', text:'提出材料替代方案或优化建议，在保证质量的前提下降低成本或缩短工期。' },
    ],
    qa: [
      { id:'qa-1', title:'综合QA检查清单', text:'生成一份完整的工程质量检查清单，涵盖建筑、结构、机电、消防各专业的关键检查项。' },
    ],
    // ── 新手平面图（来自 beginner_layout_tips.html）──
    beginner: [
      { id:'beg-1', title:'人流动线检查', text:'请帮我检查这个户型图的人流动线（从玄关到客厅、厨房、卧室的走动路线），看看有没有走道过长或多余折返的浪费空间？' },
      { id:'beg-2', title:'开间与进深比例', text:'这个客厅的开间（采光面宽度）和进深（房间深度）比例是多少？家具摆放会不会显得狭长阴暗？' },
      { id:'beg-3', title:'干湿分区评估', text:'从日常使用角度看，这个平面图的水区（厨房、卫生间、阳台）分布是否集中？卫生间能否做成"干湿分离"？' },
      { id:'beg-4', title:'承重墙识别', text:'在这张平面图中，哪些墙体是加粗的承重墙，哪些是细线的非承重墙？如果我要打通做成开放式厨房，能动哪些墙？' },
      { id:'beg-5', title:'南北通透检查', text:'这个平面图在夏季能形成空气对流吗？门窗相对位置是否符合"南北通透"的自然通风设计？' },
      { id:'beg-6', title:'家具尺寸推演', text:'按照 1:100 的图纸比例，我如果摆放一张 2 米长的双人床和标准衣柜，卧室还剩下多少过道通道宽度（建议不小于 60cm）？' },
    ],

      const catCount=Object.values(promptsData).flat().length;
      html+=`<div class="collapse-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><span>${meta.name} (${filtered.length}/${prompts.length})</span><span class="collapse-arrow">▼</span></div>
      <div class="collapse-content ${searchQuery?'open':''}">${filtered.map(p=>`
        <div class="prompt-item">
          <div style="font-weight:600;font-size:.85rem;margin-bottom:4px">${escapeHtml(p.title)}</div>
          <div style="font-size:.75rem;color:var(--text2);margin:4px 0;line-height:1.4">${escapeHtml(p.text.substring(0,100))}${p.text.length>100?'...':''}</div>
          <div style="display:flex;gap:4px;margin-top:6px">
            <button class="btn primary btn-sm" onclick="window._copyPromptById('${p.id}')">📋 复制</button>
            <button class="btn btn-sm ${isSaved(p.id)?'saved':''}" onclick="window._toggleSaveById('${p.id}')">${isSaved(p.id)?'⭐ 已收藏':'☆ 收藏'}</button>
          </div>
        </div>`).join('')}</div>`;
    });
    // 平台快捷切换
    html += `<div style="margin-top:14px"><div style="font-size:.8rem;color:var(--text2);margin-bottom:6px">🤖 当前平台：${platforms.find(p=>p.id===selectedPlatform)?.name}</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${platforms.map(p=>`<span class="chip ${selectedPlatform===p.id?'active':''}" onclick="window._setPlatform('${p.id}')">${p.name}</span>`).join('')}</div></div>`;
    $views.prompts.innerHTML=html;
    document.getElementById('promptSearch')?.addEventListener('input',function(){searchQuery=this.value;renderPromptsView();});
  }

  // ── 收藏 ──
  function renderSavedView(){
    let html='<h3 style="font-size:1rem;margin-bottom:10px">⭐ 收藏的提示词</h3>';
    if(!savedPrompts.length) html+='<p style="color:var(--text3);">暂无收藏，浏览提示库时点击 ☆ 收藏</p>';
    else savedPrompts.slice().reverse().forEach(sp=>{
      html+=`<div class="prompt-item"><b>${sp.title||'无标题'}</b>
      <div style="font-size:.75rem;color:var(--text2)">${(sp.text||'').substring(0,80)}...</div>
      <div style="display:flex;gap:4px;margin-top:6px">
        <button class="btn primary btn-sm" onclick="window._copySavedText('${sp.id}')">📋 复制</button>
        <button class="btn btn-sm saved" onclick="window._removeSaved('${sp.id}')">取消收藏</button></div></div>`;
    });
    $views.saved.innerHTML=html;
  }

  // ── 排查 ──
  function renderTroubleshootView(){
    let html='<h3 style="font-size:1rem;">🔍常见排查项目</h3><p style="color:var(--text2);font-size:.8rem;margin-bottom:10px">勾选问题后生成清单，点击"询问AI"获取分析</p>';
    Object.entries(troubleshootData).forEach(([cat, items])=>{
      const catName={elec:'⚡电气',plumb:'💧给排水',hvac:'❄️暖通',constr:'🚧施工'}[cat]||cat;
      html+=`<div class="collapse-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><span>${catName} (${items.length})</span><span class="collapse-arrow">▼</span></div>
      <div class="collapse-content">${items.map(item=>`
        <div class="trouble-item">
          <input type="checkbox" id="chk_${item.id}" ${troubleshootChecks[item.id]?'checked':''} onchange="window._toggleTroubleCheck('${item.id}')">
          <label for="chk_${item.id}">${item.text}</label>
          <button class="btn btn-sm btn-follow" onclick="window._askAIForTrouble('${item.id}')">🤖询问AI</button>
        </div>`).join('')}</div>`;
    });
    html+=`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="window._copyTroubleList()">📋复制已勾选清单</button><button class="btn" onclick="window._resetTrouble()">🔄重置</button></div>`;
    $views.troubleshoot.innerHTML=html;
  }

  // ── 新手 ──
  function renderNewbieView(){
    let html='<h3 style="font-size:1rem;">🚀新手项目快速启动</h3><p style="color:var(--text2);font-size:.8rem;margin-bottom:10px">点击按钮生成提示词，复制后到AI平台使用</p>';
    newbieSteps.forEach((step,idx)=>{
      html+=`<div class="card" style="cursor:default;margin-bottom:8px;">
        <div class="card-title">${step.phase}</div>
        <div style="font-size:.8rem;color:var(--text2);margin:6px 0">${step.desc}</div>
        ${step.prompts.map(p=>`<button class="btn btn-sm" style="margin:2px;" onclick="window._copyNewbiePrompt('${escapeHtml(p.text).replace(/'/g,"\\'")}')">📋${p.label}</button>`).join('')}
      </div>`;
    });
    html+=`<div class="card" style="cursor:default;"><div class="card-title">📦一键生成项目启动清单</div><button class="btn primary" onclick="window._copyNewbieFullList()">📋复制完整启动清单</button></div>`;
    $views.newbie.innerHTML=html;
  }

  // ── 设置 ──
  function renderSettingsView(){
    const ctx=projectContext;
    const fields=[{key:'projectName',label:'项目名称'},{key:'country',label:'国家/地区'},{key:'buildingType',label:'建筑类型'},{key:'floors',label:'层数'},{key:'ceilingHeight',label:'层高(m)'},{key:'electricalStandard',label:'电气标准'},{key:'voltage',label:'电压等级'},{key:'dbQuantity',label:'配电箱数量'},{key:'drawingVersion',label:'图纸版本'}];
    let html=`<h3 style="font-size:1rem;">⚙️设置</h3>
    <div class="card"><button class="btn" onclick="window._toggleDark()">${darkMode?'🌙深色模式':'☀️浅色模式'}</button></div>
    <div class="card"><h4 style="font-size:.9rem;margin-bottom:8px">📋项目上下文（复制时自动注入）</h4>${fields.map(f=>`<div style="margin-bottom:6px"><label style="font-size:.8rem;color:var(--text2)">${f.label}</label><input class="search-input" value="${escapeHtml(ctx[f.key]||'')}" data-ctx="${f.key}"></div>`).join('')}
    <button class="btn primary" onclick="window._saveContext()">💾保存上下文</button></div>`;
    $views.settings.innerHTML=html;
    document.querySelectorAll('[data-ctx]').forEach(inp=>inp.addEventListener('change',function(){projectContext[this.dataset.ctx]=this.value;saveState();}));
  }

  function renderQAView(){
    let html=`<h3 style="font-size:1rem;">✅ Final QA 检查清单</h3>`;
    qaCategories.forEach(c=>html+=`<div class="trouble-item"><input type="checkbox" ${qaChecks[c]?'checked':''} onchange="window._toggleQA('${c}')"><span>${c}</span></div>`);
    html+=`<button class="btn primary" onclick="window._copyQASummary()">📋复制摘要</button>`;
    $views.dashboard.innerHTML=html;$views.dashboard.classList.add('active');
  }

  // ── 工具函数 ──
  function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function findPromptById(id){
    for(let[cat,arr]of Object.entries(promptsData)){const f=arr.find(p=>p.id===id);if(f)return{...f,categoryKey:cat};}
    return savedPrompts.find(p=>p.id===id);
  }

  // ── 全局暴露 ──
  window._goCategory=function(cat){window._currentCat=cat;searchQuery='';switchView('prompts');};
  window._goQA=function(){renderQAView();};
  window._copyPromptById=function(id){const p=findPromptById(id);if(p)copyToClipboard(p.text);};
  window._copySavedText=function(id){const p=savedPrompts.find(x=>x.id===id);if(p)copyToClipboard(p.text||'');};
  window._toggleSaveById=function(id){const p=findPromptById(id);if(p)toggleSave(id,{title:p.title,text:p.text,categoryKey:p.categoryKey});};
  window._removeSaved=function(id){savedPrompts=savedPrompts.filter(p=>p.id!==id);saveState();renderSavedView();};
  window._setPlatform=function(pid){selectedPlatform=pid;renderPromptsView();showToast('已切换至 '+platforms.find(p=>p.id===pid)?.name);};
  window._toggleDark=function(){darkMode=!darkMode;applyTheme();saveState();renderSettingsView();};
  window._saveContext=function(){document.querySelectorAll('[data-ctx]').forEach(i=>projectContext[i.dataset.ctx]=i.value);saveState();showToast('上下文已保存');};
  window._toggleQA=function(cat){qaChecks[cat]=!qaChecks[cat];saveState();renderQAView();};
  window._copyQASummary=function(){const list=qaCategories.map(c=>`${qaChecks[c]?'✅':'☐'} ${c}`).join('\n');copyToClipboard('QA检查清单:\n'+list);};
  window._toggleTroubleCheck=function(id){troubleshootChecks[id]=!troubleshootChecks[id];saveState();};
  window._askAIForTrouble=function(id){let item=null;Object.values(troubleshootData).forEach(arr=>{const f=arr.find(x=>x.id===id);if(f)item=f;});if(item)copyToClipboard(item.prompt||item.text);};
  window._copyTroubleList=function(){let items=[];Object.values(troubleshootData).flat().forEach(item=>{if(troubleshootChecks[item.id])items.push(item.text);});if(!items.length)showToast('请先勾选问题');else copyToClipboard('常见排查问题清单：\n'+items.map((t,i)=>`${i+1}.${t}`).join('\n'));};
  window._resetTrouble=function(){troubleshootChecks={};saveState();renderTroubleshootView();};
  window._copyNewbiePrompt=function(text){copyToClipboard(text);};
  window._copyNewbieFullList=function(){let list='【新手项目启动清单】\n';newbieSteps.forEach(step=>{list+=`\n${step.phase}\n${step.desc}\n`;step.prompts.forEach(p=>list+=` - ${p.label}: ${p.text}\n`);});list+='\n请按顺序使用以上提示词与AI交互。';copyToClipboard(list);};

  function applyTheme(){if(darkMode){document.body.classList.add('dark');$themeToggle.textContent='☀️';}else{document.body.classList.remove('dark');$themeToggle.textContent='🌙';}}
  applyTheme();
  $themeToggle.addEventListener('click',()=>{darkMode=!darkMode;applyTheme();saveState();});
  $navItems.forEach(item=>item.addEventListener('click',function(){switchView(this.dataset.view);}));

  updateBadge();
  renderDashboard();
  renderPromptsView();renderSavedView();renderTroubleshootView();renderNewbieView();renderSettingsView();
  $views.dashboard.classList.add('active');
})();
</script>
</body>
</html>
