<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
    <title>建筑 & M&E AI 工具箱 · 排查+新手</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --surface2: #f0f0f2;
            --text: #1a1a2e;
            --text2: #555;
            --text3: #888;
            --primary: #1a73e8;
            --primary-light: #e8f0fe;
            --accent-arch: #f97316;
            --accent-elec: #eab308;
            --accent-plumb: #06b6d4;
            --accent-hvac: #3b82f6;
            --accent-boq: #8b5cf6;
            --accent-cost: #10b981;
            --accent-constr: #ef4444;
            --accent-qa: #14b8a6;
            --border: #e0e0e4;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --nav-height: 60px;
            --header-height: 52px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark {
            --bg: #12121a;
            --surface: #1c1c28;
            --surface2: #252535;
            --text: #e8e8f0;
            --text2: #b0b0bb;
            --text3: #777788;
            --primary: #5b9cf5;
            --primary-light: #1e2a3d;
            --border: #2a2a38;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html { font-size:15px; height:100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text);
            min-height:100vh; max-width:500px; margin:0 auto;
            position:relative; overflow-x:hidden; line-height:1.5;
            transition: background var(--transition), color var(--transition);
            padding-bottom: calc(var(--nav-height) + 20px);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .app-header {
            position: sticky; top:0; z-index:100;
            background: var(--surface); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding:10px 16px; display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid var(--border); height:var(--header-height);
            transition: background var(--transition), border var(--transition);
        }
        .app-title { font-weight:700; font-size:1.1rem; display:flex; align-items:center; gap:8px; }
        .theme-toggle {
            width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
            background:var(--surface2); cursor:pointer; font-size:1.2rem;
            display:flex; align-items:center; justify-content:center; transition:all var(--transition); color:var(--text);
        }
        .view { display:none; padding:12px 14px; animation:fadeSlideIn 0.25s ease; }
        .view.active { display:block; }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
        .bottom-nav {
            position:fixed; bottom:0; left:50%; transform:translateX(-50%);
            width:100%; max-width:500px; background:var(--surface);
            border-top:1px solid var(--border); display:flex; align-items:center;
            overflow-x:auto; white-space:nowrap; padding:4px 2px;
            padding-bottom:max(4px, env(safe-area-inset-bottom));
            height:var(--nav-height); z-index:100;
            box-shadow:0 -2px 12px rgba(0,0,0,0.04);
            transition: background var(--transition), border var(--transition);
            scrollbar-width: none; -ms-overflow-style:none;
        }
        .bottom-nav::-webkit-scrollbar { display:none; }
        .nav-item {
            display:flex; flex-direction:column; align-items:center; gap:2px;
            cursor:pointer; padding:4px 8px; border-radius:10px; font-size:0.6rem;
            color:var(--text3); font-weight:500; min-width:44px; transition:all var(--transition);
        }
        .nav-item .nav-icon { font-size:1.2rem; }
        .nav-item.active { color:var(--primary); font-weight:600; }
        .nav-badge {
            position:absolute; top:0; right:2px; background:#ef4444; color:#fff;
            font-size:0.5rem; width:14px; height:14px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; font-weight:700; display:none;
        }
        .nav-badge.show { display:flex; }
        .card {
            background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:10px;
            box-shadow:var(--shadow); border:1px solid var(--border); transition:all var(--transition);
            cursor:pointer; position:relative;
        }
        .card-header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
        .card-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
        .card-title { font-weight:600; font-size:0.95rem; }
        .card-subtitle { font-size:0.75rem; color:var(--text2); }
        .btn {
            padding:8px 14px; border-radius:20px; border:1px solid var(--border);
            background:var(--surface2); cursor:pointer; font-size:0.75rem; font-weight:500;
            transition:all var(--transition); display:inline-flex; align-items:center; gap:5px;
            color:var(--text); font-family:inherit; white-space:nowrap;
        }
        .btn.primary { background:var(--primary); color:#fff; border:none; }
        .btn.saved { background:#fef3c7; border-color:#f59e0b; color:#92400e; }
        .dark .btn.saved { background:#3d2e0a; border-color:#b45309; color:#fcd34d; }
        .btn-sm { padding:5px 10px; font-size:0.7rem; border-radius:14px; }
        .btn-follow { background:#ede9fe; border-color:#a78bfa; color:#5b21b6; }
        .dark .btn-follow { background:#2e1a4a; border-color:#7c3aed; color:#c4b5fd; }
        .search-bar { display:flex; gap:8px; margin-bottom:12px; }
        .search-input {
            flex:1; padding:10px 16px; border-radius:24px; border:1.5px solid var(--border);
            background:var(--surface); font-size:0.9rem; outline:none; color:var(--text);
            transition:all var(--transition); user-select:text; -webkit-user-select:text;
        }
        .search-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
        .chip {
            padding:6px 12px; border-radius:18px; border:1.5px solid var(--border);
            cursor:pointer; font-size:0.7rem; font-weight:500; background:var(--surface);
            color:var(--text2); transition:all var(--transition);
        }
        .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .collapse-header {
            display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
            background:var(--surface); border-radius:var(--radius-sm); cursor:pointer;
            font-weight:600; font-size:0.9rem; border:1px solid var(--border); margin-bottom:4px;
        }
        .collapse-content { max-height:0; overflow:hidden; transition:max-height 0.35s ease; padding:0 4px; }
        .collapse-content.open { max-height:2000px; }
        .collapse-arrow { transition:transform 0.3s; font-size:0.8rem; color:var(--text3); }
        .collapse-header.open .collapse-arrow { transform:rotate(180deg); }
        .trouble-item, .newbie-step {
            display:flex; align-items:center; gap:10px; padding:12px;
            border-radius:var(--radius-xs); border:1px solid var(--border);
            margin-bottom:6px; background:var(--surface); transition:all var(--transition);
        }
        .trouble-item label { flex:1; font-size:0.8rem; user-select:text; }
        .toast {
            position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
            background:#1a1a2e; color:#fff; padding:10px 20px; border-radius:24px;
            font-size:0.8rem; z-index:200; opacity:0; pointer-events:none;
            transition:all 0.3s ease; white-space:nowrap; box-shadow:0 8px 24px rgba(0,0,0,0.3);
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .dark .toast { background:#e8e8f0; color:#1a1a2e; }
        .accent-arch { background:#fff7ed; color:#c2410c; } .dark .accent-arch { background:#2d1a0a; color:#fb923c; }
        .accent-elec { background:#fefce8; color:#a16207; } .dark .accent-elec { background:#2d2506; color:#facc15; }
        .accent-plumb { background:#ecfeff; color:#0e7490; } .dark .accent-plumb { background:#0a2025; color:#22d3ee; }
        .accent-hvac { background:#eff6ff; color:#1d4ed8; } .dark .accent-hvac { background:#0a1628; color:#60a5fa; }
        .accent-boq { background:#f5f3ff; color:#6d28d9; } .dark .accent-boq { background:#1a0f2e; color:#a78bfa; }
        .accent-cost { background:#ecfdf5; color:#047857; } .dark .accent-cost { background:#0a1f18; color:#34d399; }
        .accent-constr { background:#fef2f2; color:#b91c1c; } .dark .accent-constr { background:#2d0a0a; color:#f87171; }
        .accent-qa { background:#f0fdfa; color:#0f766e; } .dark .accent-qa { background:#0a1f1c; color:#2dd4bf; }
        .accent-newbie { background:#f0f9ff; color:#0369a1; } .dark .accent-newbie { background:#0c1a2b; color:#38bdf8; }
        .accent-trouble { background:#fff1f2; color:#be123c; } .dark .accent-trouble { background:#2d0f14; color:#fb7185; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-title"><span class="icon">🏗️</span> M&E Toolbox</div>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
    </header>
    <div class="toast" id="toast"></div>

    <!-- 视图容器 -->

                localStorage.setItem('mep_context', JSON.stringify(projectContext));
                localStorage.setItem('mep_qa', JSON.stringify(qaChecks));
                localStorage.setItem('mep_trouble', JSON.stringify(troubleshootChecks));
                updateBadge();
            }
            function updateBadge() {
                if(savedPrompts.length>0){ $savedBadge.textContent=savedPrompts.length; $savedBadge.classList.add('show'); }
                else $savedBadge.classList.remove('show');
            }
            function showToast(msg) {
                $toast.textContent=msg; $toast.classList.add('show');
                clearTimeout($toast._timeout); $toast._timeout=setTimeout(()=>$toast.classList.remove('show'),1800);
            }
            function buildFullPrompt(promptText) {
                let ctx=''; const ctxObj=projectContext;
                const filled=Object.entries(ctxObj).filter(([,v])=>v&&v.trim());
                if(filled.length) ctx='\n\n【项目上下文】\n'+filled.map(([k,v])=>`- ${({projectName:'项目名称',country:'国家',buildingType:'建筑类型',floors:'层数',ceilingHeight:'层高',electricalStandard:'电气标准',voltage:'电压',dbQuantity:'配电箱数量',drawingVersion:'图纸版本'})[k]||k}: ${v}`).join('\n');
                const platformNote = ({chatgpt:'\n\n[请以结构化方式输出，使用markdown格式]',claude:'\n\n[Please provide detailed response]',gemini:'\n\n[请提供详细技术分析]',hermes:'\n\n[Use concise technical language]',qclaw:'\n\n[Provide compliance analysis]',opencode:'\n\n[Structured code style]',codex:'\n\n[Code-oriented analysis]'})[selectedPlatform]||'';
                return promptText+ctx+platformNote;
            }
            function copyToClipboard(text) {
                const full=buildFullPrompt(text);
                if(navigator.clipboard) navigator.clipboard.writeText(full).then(()=>showToast('✅ 已复制'));
                else { const ta=document.createElement('textarea'); ta.value=full; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('✅ 已复制'); }
                addRecent(text);
            }
            function addRecent(text) { recentPrompts=recentPrompts.filter(p=>p.text!==text); recentPrompts.unshift({text,time:Date.now()}); if(recentPrompts.length>30) recentPrompts=recentPrompts.slice(0,30); saveState(); }
            function toggleSave(promptId, data) {
                const idx=savedPrompts.findIndex(p=>p.id===promptId);
                if(idx>=0){ savedPrompts.splice(idx,1); showToast('已取消收藏'); }
                else { savedPrompts.push({id:promptId,...data,savedAt:Date.now()}); showToast('⭐ 已收藏'); }
                saveState(); refreshCurrentView();
            }
            function isSaved(id){ return savedPrompts.some(p=>p.id===id); }
            function refreshCurrentView() {
                if(currentView==='saved') renderSavedView();
                else if(currentView==='editor') renderEditorView();
                else if(currentView==='categories') renderCategoriesView();
            }

            // ────────── 视图切换 ──────────
            function switchView(viewName) {
                currentView=viewName;
                Object.values($views).forEach(v=>v.classList.remove('active'));
                $views[viewName].classList.add('active');
                $navItems.forEach(n=>n.classList.remove('active'));
                const nav=document.querySelector(`.nav-item[data-view="${viewName}"]`);
                if(nav) nav.classList.add('active');
                renderView(viewName);
                window.scrollTo({top:0,behavior:'smooth'});
            }
            function renderView(name) {
                if(name==='dashboard') renderDashboard();
                else if(name==='categories') renderCategoriesView();
                else if(name==='editor') renderEditorView();
                else if(name==='saved') renderSavedView();
                else if(name==='troubleshoot') renderTroubleshootView();
                else if(name==='newbie') renderNewbieView();
                else if(name==='settings') renderSettingsView();
            }

            // ────────── 渲染函数 ──────────
            function renderDashboard() {
                let html=`<div style="margin-bottom:6px;"><span style="font-weight:700;">📋 快速访问</span></div><div class="dashboard-grid">`;
                Object.entries(categoryMeta).forEach(([key,meta])=>{
                    html+=`<div class="dash-card" onclick="switchView('editor');window._setCategory('${key}')"><div class="dash-icon ${meta.accent}">${meta.icon}</div><div>${meta.name.replace(/[^\u4e00-\u9fa5]/g,'').trim()}</div></div>`;
                });
                html+=`</div>
                <div class="card" onclick="switchView('troubleshoot')"><div class="card-header"><div class="card-icon accent-trouble">🔍</div><div><div class="card-title">常见排查项目</div><div class="card-subtitle">电气·给排水·暖通·施工常见问题</div></div></div></div>
                <div class="card" onclick="switchView('newbie')"><div class="card-header"><div class="card-icon accent-newbie">🚀</div><div><div class="card-title">新手推荐项目</div><div class="card-subtitle">从零开始的M&E项目引导</div></div></div></div>
                <div class="card" onclick="window._goQA()"><div class="card-header"><div class="card-icon accent-qa">✅</div><div><div class="card-title">Final QA 检查清单</div></div></div></div>`;
                $views.dashboard.innerHTML=html;
            }

            function renderCategoriesView() {
                let html=`<div class="search-bar"><input class="search-input" id="catSearch" placeholder="🔍 搜索提示词" value="${escapeHtml(searchQuery)}"></div>`;
                Object.entries(categoryMeta).forEach(([key,meta])=>{
                    const prompts=promptsData[key]||[];
                    const filtered=searchQuery?prompts.filter(p=>p.title.includes(searchQuery)||p.text.includes(searchQuery)):prompts;
                    if(!filtered.length && searchQuery) return;
                    html+=`<div class="collapse-header"><span>${meta.name} (${filtered.length})</span><span class="collapse-arrow">▼</span></div>
                    <div class="collapse-content ${searchQuery?'open':''}">${filtered.map(p=>`
                        <div class="prompt-item"><b>${p.title}</b>
                        <div style="font-size:0.75rem;color:var(--text2);margin:4px 0;">${p.text.substring(0,80)}...</div>
                        <button class="btn primary btn-sm" onclick="window._copyPromptById('${p.id}')">📋复制</button>
                        <button class="btn btn-sm ${isSaved(p.id)?'saved':''}" onclick="window._toggleSaveById('${p.id}')">${isSaved(p.id)?'⭐':'☆'}</button>
                        </div>`).join('')}</div>`;
                });
                $views.categories.innerHTML=html;
                document.getElementById('catSearch')?.addEventListener('input',function(){ searchQuery=this.value; renderCategoriesView(); });
            }

            function renderEditorView() {
                let prompts=[]; if(window._currentCat && promptsData[window._currentCat]) prompts=promptsData[window._currentCat]; else prompts=Object.values(promptsData).flat();
                let html=`<div class="search-bar"><input class="search-input" id="editorSearch" placeholder="🔍 搜索" value="${escapeHtml(searchQuery)}"></div>
                <div>🤖 平台：${platforms.map(p=>`<span class="chip ${selectedPlatform===p.id?'active':''}" onclick="window._setPlatform('${p.id}')">${p.name}</span>`).join('')}</div>
                <div style="margin:10px 0;">${prompts.map(p=>`
                    <div class="prompt-item"><b>${p.title}</b>
                    <div style="font-size:0.75rem;margin:4px 0;">${p.text.substring(0,80)}...</div>
                    <button class="btn primary btn-sm" onclick="window._copyPromptById('${p.id}')">📋复制</button>
                    <button class="btn btn-sm ${isSaved(p.id)?'saved':''}" onclick="window._toggleSaveById('${p.id}')">${isSaved(p.id)?'⭐':'☆'}</button>
                    </div>`).join('')}</div>`;
                $views.editor.innerHTML=html;
                document.getElementById('editorSearch')?.addEventListener('input',function(){ searchQuery=this.value; renderEditorView(); });
            }

            function renderSavedView() {
                let html='<h3>⭐ 收藏的提示词</h3>';
                if(!savedPrompts.length) html+='<p style="color:var(--text3);">暂无收藏</p>';
                else savedPrompts.slice().reverse().forEach(sp=>{
                    html+=`<div class="prompt-item"><b>${sp.title||'无标题'}</b>
                    <div style="font-size:0.75rem;">${(sp.text||'').substring(0,80)}...</div>
                    <button class="btn primary btn-sm" onclick="window._copySavedText('${sp.id}')">📋复制</button>
                    <button class="btn btn-sm saved" onclick="window._removeSaved('${sp.id}')">取消收藏</button></div>`;
                });
                $views.saved.innerHTML=html;
            }

            // 排查视图
            function renderTroubleshootView() {
                let html='<h3>🔍 常见排查项目</h3><p style="color:var(--text2);font-size:0.8rem;">勾选问题后可生成清单，点击“询问AI”获取分析</p>';
                Object.entries(troubleshootData).forEach(([cat, items])=>{
                    const catName = {elec:'⚡电气', plumb:'💧给排水', hvac:'❄️暖通', constr:'🚧施工'}[cat]||cat;
                    html+=`<div class="collapse-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><span>${catName} (${items.length})</span><span class="collapse-arrow">▼</span></div>
                    <div class="collapse-content">${items.map(item=>`
                        <div class="trouble-item">
                            <input type="checkbox" id="chk_${item.id}" ${troubleshootChecks[item.id]?'checked':''} onchange="window._toggleTroubleCheck('${item.id}')">
                            <label for="chk_${item.id}">${item.text}</label>
                            <button class="btn btn-sm btn-follow" onclick="window._askAIForTrouble('${item.id}')">🤖询问AI</button>
                        </div>`).join('')}</div>`;
                });
                html+=`<div style="margin-top:12px;display:flex;gap:8px;"><button class="btn primary" onclick="window._copyTroubleList()">📋 复制已勾选问题清单</button><button class="btn" onclick="window._resetTrouble()">🔄 重置</button></div>`;
                $views.troubleshoot.innerHTML=html;
            }

            // 新手视图
            function renderNewbieView() {
                let html='<h3>🚀 新手项目快速启动</h3><p style="color:var(--text2);font-size:0.8rem;">点击按钮生成对应提示词，复制到AI平台使用</p>';
                newbieSteps.forEach((step, idx)=>{
                    html+=`<div class="card" style="cursor:default;margin-bottom:8px;">
                        <div class="card-title">${step.phase}</div>
                        <div style="font-size:0.8rem;color:var(--text2);margin:6px 0;">${step.desc}</div>
                        ${step.prompts.map(p=>`<button class="btn btn-sm" style="margin:2px;" onclick="window._copyNewbiePrompt('${escapeHtml(p.text).replace(/'/g,"\\'")}')">📋 ${p.label}</button>`).join('')}
                    </div>`;
                });
                html+=`<div class="card" style="cursor:default;">
                    <div class="card-title">📦 一键生成项目启动清单</div>
                    <button class="btn primary" onclick="window._copyNewbieFullList()">📋 复制完整启动清单</button>
                </div>`;
                $views.newbie.innerHTML=html;
            }

            function renderSettingsView() {
                const ctx=projectContext;
                const fields=[ {key:'projectName',label:'项目名称'},{key:'country',label:'国家/地区'},{key:'buildingType',label:'建筑类型'},{key:'floors',label:'层数'},{key:'ceilingHeight',label:'层高(m)'},{key:'electricalStandard',label:'电气标准'},{key:'voltage',label:'电压等级'},{key:'dbQuantity',label:'配电箱数量'},{key:'drawingVersion',label:'图纸版本'} ];
                let html=`<h3>⚙️ 设置</h3>
                <div class="card"><button class="btn" onclick="window._toggleDark()">${darkMode?'🌙 深色':'☀️ 浅色'}</button></div>
                <div class="card"><h4>📋 项目上下文</h4>${fields.map(f=>`<div><label>${f.label}</label><input class="search-input" value="${escapeHtml(ctx[f.key]||'')}" data-ctx="${f.key}"></div>`).join('')}
                <button class="btn primary" onclick="window._saveContext()">💾 保存</button></div>`;
                $views.settings.innerHTML=html;
                document.querySelectorAll('[data-ctx]').forEach(inp=>inp.addEventListener('change',function(){ projectContext[this.dataset.ctx]=this.value; saveState(); }));
            }

            function renderQAView() {
                let html=`<h3>✅ Final QA</h3>`;
                qaCategories.forEach(c=>html+=`<div class="trouble-item"><input type="checkbox" ${qaChecks[c]?'checked':''} onchange="window._toggleQA('${c}')"><span>${c}</span></div>`);
                html+=`<button class="btn primary" onclick="window._copyQASummary()">📋 复制摘要</button>`;
                $views.dashboard.innerHTML=html; $views.dashboard.classList.add('active');
            }

            // ────────── 辅助函数 ──────────
            function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
            function findPromptById(id){
                for(let [cat,arr] of Object.entries(promptsData)){ const f=arr.find(p=>p.id===id); if(f) return {...f, categoryKey:cat}; }
                return savedPrompts.find(p=>p.id===id);
            }

            // ────────── 全局方法暴露 ──────────
            window._setCategory = function(cat){ window._currentCat=cat; searchQuery=''; switchView('editor'); };
            window._goQA = function(){ renderQAView(); };
            window._copyPromptById = function(id){ const p=findPromptById(id); if(p) copyToClipboard(p.text); };
            window._copySavedText = function(id){ const p=savedPrompts.find(x=>x.id===id); if(p) copyToClipboard(p.text||''); };
            window._toggleSaveById = function(id){ const p=findPromptById(id); if(p) toggleSave(id,{title:p.title,text:p.text,categoryKey:p.categoryKey}); };
            window._removeSaved = function(id){ savedPrompts=savedPrompts.filter(p=>p.id!==id); saveState(); renderSavedView(); };
            window._setPlatform = function(pid){ selectedPlatform=pid; renderEditorView(); showToast('已切换至 '+platforms.find(p=>p.id===pid)?.name); };
            window._toggleDark = function(){ darkMode=!darkMode; applyTheme(); saveState(); renderSettingsView(); };
            window._saveContext = function(){ document.querySelectorAll('[data-ctx]').forEach(i=>projectContext[i.dataset.ctx]=i.value); saveState(); showToast('上下文已保存'); };
            window._toggleQA = function(cat){ qaChecks[cat]=!qaChecks[cat]; saveState(); renderQAView(); };
            window._copyQASummary = function(){ const list=qaCategories.map(c=>`${qaChecks[c]?'✅':'☐'} ${c}`).join('\n'); copyToClipboard('QA检查清单:\n'+list); };

            // 排查相关
            window._toggleTroubleCheck = function(id){ troubleshootChecks[id]=!troubleshootChecks[id]; saveState(); };
            window._askAIForTrouble = function(id){
                let item=null; Object.values(troubleshootData).forEach(arr=>{ const f=arr.find(x=>x.id===id); if(f) item=f; });
                if(item) copyToClipboard(item.prompt || item.text);
            };
            window._copyTroubleList = function(){
                let items=[]; Object.values(troubleshootData).flat().forEach(item=>{ if(troubleshootChecks[item.id]) items.push(item.text); });
                if(!items.length) showToast('请先勾选问题');
                else copyToClipboard('常见排查问题清单：\n'+items.map((t,i)=>`${i+1}. ${t}`).join('\n'));
            };
            window._resetTrouble = function(){ troubleshootChecks={}; saveState(); renderTroubleshootView(); };

            // 新手相关
            window._copyNewbiePrompt = function(text){ copyToClipboard(text); };
            window._copyNewbieFullList = function(){
                let list = '【新手项目启动清单】\n';
                newbieSteps.forEach(step=>{ list+=`\n${step.phase}\n${step.desc}\n`; step.prompts.forEach(p=>list+=`  - ${p.label}: ${p.text}\n`); });
                list+='\n请按顺序使用以上提示词与AI交互，逐步推进项目。';
                copyToClipboard(list);
            };

            // 主题应用
            function applyTheme() {
                if(darkMode){ document.body.classList.add('dark'); $themeToggle.textContent='☀️'; }
                else { document.body.classList.remove('dark'); $themeToggle.textContent='🌙'; }
            }
            applyTheme();
            $themeToggle.addEventListener('click',()=>{ darkMode=!darkMode; applyTheme(); saveState(); });

            // 底部导航事件
            $navItems.forEach(item=>item.addEventListener('click',function(){ switchView(this.dataset.view); }));

            // 初始化
            updateBadge();
            renderDashboard();
            // 预渲染其他视图
            renderCategoriesView(); renderEditorView(); renderSavedView(); renderTroubleshootView(); renderNewbieView(); renderSettingsView();
            $views.dashboard.classList.add('active');
        })();
    </script>
</body>
</html>
