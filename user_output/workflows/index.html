<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Prompt Workflow Notes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;-webkit-font-smoothing:antialiased}
.navbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid #e5e5ea;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.nav-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav-sub{font-size:12px;color:#86868b}
.container{max-width:800px;margin:0 auto;padding:24px 16px 40px}
.wf-grid{display:flex;flex-direction:column;gap:8px}
.wf-card{background:#fff;border-radius:16px;padding:16px 18px;cursor:pointer;border:1px solid #e5e5ea;transition:.2s;display:flex;align-items:center;gap:14px}
.wf-card:hover{border-color:#007aff;box-shadow:0 2px 12px rgba(0,122,255,.1)}
.wf-card.active{border-color:#007aff;background:#f5f9ff}
.wf-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.wf-info{flex:1}
.wf-name{font-weight:600;font-size:15px}
.wf-desc{font-size:12px;color:#86868b;margin-top:2px}
.wf-steps-count{font-size:11px;color:#aeaeb2;white-space:nowrap}
.wf-arrow{color:#c7c7cc;font-size:14px;transition:.2s}
.wf-card:hover .wf-arrow,.wf-card.active .wf-arrow{color:#007aff}

.detail{padding-top:20px;display:none}
.detail.visible{display:block;animation:fadeUp .35s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.detail-header{margin-bottom:16px}
.detail-title{font-size:20px;font-weight:700}
.detail-desc{font-size:13px;color:#86868b;margin-top:4px}
.progress{display:flex;gap:8px;margin-bottom:20px;align-items:center}
.prog-dot{width:10px;height:10px;border-radius:50%;background:#e5e5ea;transition:.3s}
.prog-dot.done{background:#34c759;box-shadow:0 0 6px rgba(52,199,89,.4)}
.prog-dot.current{background:#007aff;box-shadow:0 0 6px rgba(0,122,255,.4);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.prog-label{font-size:11px;color:#86868b;margin-left:4px}
.step{background:#fff;border-radius:14px;padding:18px;margin-bottom:10px;border:1px solid #e5e5ea;transition:.2s}
.step.current-step{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.08)}
.step-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.step-num{font-size:11px;font-weight:600;color:#86868b;background:#f5f5f7;padding:2px 10px;border-radius:999px}
.step-label{font-weight:600;font-size:14px}
.step-instr{font-size:13px;color:#555;line-height:1.5;margin-bottom:12px}
.prompt-box{background:#f5f5f7;border-radius:10px;padding:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-bottom:10px;border:1px solid #e5e5ea;position:relative;font-family:'SF Mono','Fira Code',Consolas,monospace}
.copy-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #e5e5ea;background:#fff;color:#1d1d1f;transition:.2s}
.copy-btn:hover{background:#f5f5f7;border-color:#c7c7cc}
.copy-btn.copied{background:#f0fff4;border-color:#34c759;color:#34c759}
.step-outcome{font-size:12px;color:#86868b;margin-top:8px;padding:8px 12px;background:#f5f5f7;border-radius:8px;border:1px solid #e5e5ea}
.step-outcome strong{color:#1d1d1f}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:300;opacity:0;transition:.35s}
.toast.show{opacity:1}
.run-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #007aff;background:#007aff;color:#fff;transition:.2s;margin-left:6px}
.run-btn:hover{background:#0066d6}
.run-btn:disabled{opacity:.5;cursor:wait}
.run-btn.running{background:#ff9500;border-color:#ff9500}
.result-box{background:#f5f5f7;border-radius:10px;padding:14px;margin-top:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;border:1px solid #e5e5ea;display:none;max-height:400px;overflow-y:auto}
.result-box.visible{display:block;animation:fadeUp .3s}
.result-box.loading{opacity:.6}
.result-box .r-hdr{font-size:11px;color:#86868b;margin-bottom:6px;display:flex;justify-content:space-between}
.result-box .r-hdr .r-close{cursor:pointer;color:#aeaeb2;padding:0 4px}
.start-hint{text-align:center;padding:40px;color:#86868b;font-size:14px}
footer{text-align:center;padding:20px;font-size:11px;color:#aeaeb2}
@media(max-width:500px){.container{padding:16px 12px 30px}.wf-card{padding:14px}}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-title">📋 Prompt Workflow Notes</div>
  <div class="nav-sub">按步骤执行，可复制也可直接运行</div>
</div>

<div class="container">
  <div class="wf-grid" id="wfGrid"></div>

  <div class="detail" id="detail">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-desc" id="detailDesc"></div>
    </div>
    <div class="progress" id="progress"></div>
    <div id="stepsContainer"></div>
  </div>
  <div class="start-hint" id="startHint">选择一个工作流开始</div>
</div>

<div class="toast" id="toast"></div>
<footer>数据仅存储在本地浏览器</footer>

<script>
const WORKFLOWS = [
  {icon:"🏠",name:"Home Assistant 故障排查",desc:"容器 → 日志 → 配置 → 设备 → 恢复",color:"#0284c7",steps:[
    {label:"检查容器状态",instr:"确认 Home Assistant Container 是否在运行。",prompt:"docker ps -a --filter name=homeassistant\n# 检查 STATUS 列：Up (正常) / Exited (异常)\ndocker logs --tail 50 homeassistant\n# 看最后50行日志，找 ERROR / WARNING"},
    {label:"检查核心日志",instr:"查看 Home Assistant 核心日志找错误。",prompt:"cat /home/pi5/home-assistant/config/home-assistant.log | tail -100\n# 关注：Integration error / Setup failed / Unavailable\ngrep -i \"error\\|exception\\|failed\" /home/pi5/home-assistant/config/home-assistant.log | tail -30"},
    {label:"检查配置有效性",instr:"验证 configuration.yaml 是否正确。",prompt:"docker exec homeassistant ha core check\n# 或手动检查 configuration.yaml 缩进和格式\necho \"检查常见问题：\"\necho \"1. YAML 缩进（空格 vs Tab）\"\necho \"2. 必填字段是否缺失\"\necho \"3. 实体ID是否有拼写错误\""},
    {label:"检查集成状态",instr:"列出已安装的集成，找出异常的。",prompt:"# 通过 Web UI 访问：http://192.168.88.113:8123\n# 设置 → 系统 → 集成\n# 看哪些显示为红色（错误）或黄色（需配置）\n# 或者 API 检查：\ncurl -s http://localhost:8123/api/states | python3 -c \"import json,sys; d=json.load(sys.stdin); [print(f'{s['entity_id']}: {s['state']}') for s in d if s['state']=='unavailable'][:20]\""},
    {label:"重启与恢复",instr:"按顺序尝试恢复。",prompt:"# 安全重启（不丢状态）：\ndocker restart homeassistant\nsleep 30\ndocker logs --tail 20 homeassistant\n\n# 如果仍然失败，检查端口占用：\nss -tlnp | grep 8123\ndocker logs homeassistant 2>&1 | grep -i \"address already in use\""},
  ]},
  {icon:"🔧",name:"OmniRoute 服务修复",desc:"状态 → 日志 → 重启 → 持久化",color:"#ea580c",steps:[
    {label:"检查服务状态",instr:"先确认 OmniRoute 是否在运行。每日简报已实现",prompt:"sudo systemctl status omniroute-desktop --no-pager\n# 看 Active: active (running) 还是 inactive (dead)\n# 如果一直在 restart，看 restart counter:\nsudo journalctl -u omniroute-desktop --no-pager | grep \"restart counter\" | tail -5"},
    {label:"分析崩溃日志",instr:"找出反复崩溃的根因。",prompt:"sudo journalctl -u omniroute-desktop --no-pager -n 100\n# 关注以下模式：\n# - SIGSEGV / Segmentation fault\n# - ERROR: ... failed\n# - OOM / Out of memory\n# - timeout / deadline exceeded"},
    {label:"重启服务",instr:"执行标准重启流程。",prompt:"sudo systemctl daemon-reload\nsudo systemctl restart omniroute-desktop\nsleep 5\nsudo systemctl status omniroute-desktop --no-pager\n\n# 如果重启后仍反复崩溃：\n# 1. 检查磁盘空间：df -h\n# 2. 检查内存：free -h\n# 3. 检查日志大小：du -sh ~/.hermes/logs/"},
    {label:"持久化修复",instr:"确保修复在下次重启后仍生效。",prompt:"sudo systemctl enable omniroute-desktop\nsudo systemctl is-enabled omniroute-desktop\n# 应返回 enabled\n\n# 如果修改了 service 文件：\nsudo systemctl daemon-reload\n\n# 写修复总结到日志：\necho \"$(date): OmniRoute restored - $(sudo systemctl is-active omniroute-desktop)\" >> ~/hermes-workspace/logs/service-restore.log"},
  ]},
  {icon:"📅",name:"Cron 日报配置",desc:"任务 → 技能 → 测试 → 调优",color:"#059669",steps:[
    {label:"定义日报内容",instr:"明确 cron 任务要做什么。",prompt:"我需要一个每日定时任务，内容如下：\n\n任务名称：[每日 AI 简报 / Pi5 健康检查 / 项目跟进]\n执行时间：[每天 08:00 / 每6小时]\n数据来源：[RSS / 系统命令 / API]\n输出格式：[Markdown / 纯文本]\n输出位置：[~/hermes-workspace/reports/ 或 Telegram]"},
    {label:"创建 Hermes Skill",instr:"先创建一个 skill 定义任务逻辑。",prompt:"在 ~/.hermes/skills/ 下创建 skill 文件：\n```\n---\nname: my-daily-brief\ndescription: \"每日简报生成\"\n---\n# 任务定义\n1. 抓取数据源（RSS/API）\n2. 分析关键信息\n3. 生成结构化报告\n4. 输出到指定位置\n```\n\n然后用 Hermes 加载 skill 并测试。"},
    {label:"注册 Cron Job",instr:"让 Hermes 创建定时任务。",prompt:"# 让 Hermes 创建 cron job：\n\"创建一个 cron job，每天早上 8:00 运行 my-daily-brief skill，\n输出格式为 Markdown，保存到 ~/hermes-workspace/reports/daily-brief-$(date +%Y%m%d).md\"\n\n# 确认创建成功：\n# Cronjob Response 应返回 job_id 和下次执行时间"},
    {label:"验证并调优",instr:"确认任务执行成功，调优内容质量。",prompt:"# 检查上次执行结果：\nls -lt ~/hermes-workspace/reports/ | head -5\ncat ~/hermes-workspace/reports/$(ls -t ~/hermes-workspace/reports/ | head -1) | head -30\n\n# 如果需要调优：\n# 1. 修改 skill 定义\n# 2. 通知 Hermes \"更新 cron job [job_id] 的 skill\"\n# 3. 重新测试"},
  ]},
  {icon:"🐳",name:"Docker 容器管理",desc:"状态 → 日志 → 修复 → 清理",color:"#2563eb",steps:[
    {label:"查看所有容器状态",instr:"了解当前 Docker 生态全貌。",prompt:"docker ps -a --format \"table {{.Names}}\t{{.Status}}\t{{.Ports}}\"\necho \"---\"\necho \"运行中：$(docker ps -q | wc -l)\"\necho \"已停止：$(docker ps -aq | wc -l) - $(docker ps -q | wc -l)\"\necho \"---\"\ndocker system df  # 查看磁盘占用"},
    {label:"检查异常容器",instr:"找出 exiting/restarting 的容器。",prompt:"docker ps -a --filter \"status=exited\" --format \"{{.Names}} {{.Status}}\"\necho \"==========\"\ndocker ps -a --filter \"status=restarting\" --format \"{{.Names}} {{.Status}}\"\n\n# 查看退出容器的日志：\ndocker logs --tail 30 [容器名]"},
    {label:"容器修复流程",instr:"按步骤修复异常容器。",prompt:"# 1. 查看日志找原因：\ndocker logs --tail 50 [容器名]\n\n# 2. 常见修复：\n# 端口冲突：ss -tlnp | grep [端口]\n# 权限问题：ls -la [挂载目录]\n# 配置错误：检查挂载的配置文件\n\n# 3. 重启：\ndocker restart [容器名]\nsleep 10\ndocker ps --filter name=[容器名] --format \"{{.Status}}\""},
    {label:"清理与优化",instr:"定期清理，释放磁盘空间。",prompt:"# 清理未使用的：\ndocker system prune -f  # 删停止的容器、未使用的网络\ndocker image prune -f   # 删未使用的镜像\ndocker volume prune -f  # 删未使用的卷\n\n# 查看最终释放空间：\ndocker system df\n\n# 注意：不要加 -a 除非确认要删所有未用镜像"},
  ]},
  {icon:"📋",name:"项目 FAQ 模板创建",desc:"结构 → 内容 → 审校 → 定稿",color:"#7c3aed",steps:[
    {label:"确定项目范围和结构",instr:"定义 FAQ 的覆盖范围和目录结构。",prompt:"为项目「[项目名]」创建 FAQ 模板。项目概况：\n- 用途：[一句话说明]\n- 技术栈：[列出技术]\n- 用户：[谁会用]\n- 部署方式：[Docker/Native/Cloud]\n\n请生成标准目录结构：\n1. 项目简介\n2. 安装部署\n3. 配置说明\n4. 使用指南\n5. 常见问题\n6. 维护与更新\n7. 联系方式"},
    {label:"编写核心内容",instr:"按结构逐块填充。",prompt:"请为以下章节撰写内容：\n项目：[项目名]\n章节：[章节名]\n\n要求：\n- 每节3-5个问答\n- 问题用用户视角写（\"怎么...\" / \"为什么...\"）\n- 答案简洁实用，必要时附带命令\n- 敏感信息用 [占位符] 标记"},
    {label:"技术与安全审查",instr:"检查命令、路径、敏感信息。",prompt:"审查这篇 FAQ 的技术准确性和安全性：\n\n1. 所有命令是否可安全复制执行\n2. 路径和文件名是否正确\n3. 是否有敏感信息泄露（IP/密码/Token/Key）\n4. 是否遗漏了依赖或前置条件\n5. 版本号是否与实际一致\n\n列出每项的问题和修正建议。"},
    {label:"格式化与发布",instr:"输出为标准模板，存入项目目录。",prompt:"将 FAQ 输出为 Markdown，格式要求：\n- 文件名：`[项目名]FAQ-v[版本]-[日期].md`\n- 存储路径：`/home/pi5/[项目目录]/`\n- 顶部包含版本号和更新日期\n- 使用 `##` 分章节，`###` 分问题\n- 代码块标明语言\n- 敏感信息用 `[占位符]`"},
  ]},
  {icon:"🌐",name:"VPS 代理与隧道",desc:"SSH → 代理 → 测试 → 监控",color:"#0891b2",steps:[
    {label:"SSH 连接检查",instr:"确认 VPS 可达。",prompt:"# VPS SSH 信息：\n# Host: 107.173.211.170\n# Port: 5522\n# User: zjwqwq123456\n\nssh -p 5522 -o ConnectTimeout=10 zjwqwq123456@107.173.211.170 \"echo connected && uptime\"\n\n# 如果连接失败：\n# 1. 检查 Pi5 公钥是否在 VPS 授权\n# 2. 测试网络：ping -c 3 107.173.211.170"},
    {label:"代理服务状态",instr:"检查 Hysteria2 代理是否运行。",prompt:"ssh -p 5522 zjwqwq123456@107.173.211.170 \"\nsystemctl status hysteria2 --no-pager\necho '---'\nss -tlnp | grep 1080\n\"\n\n# 本地 SOCKS5 测试：\ncurl -x socks5://127.0.0.1:1080 -s -o /dev/null -w \"%{http_code}\" https://www.google.com"},
    {label:"测试代理可用性",instr:"验证代理能正常访问外网。",prompt:"# 通过代理访问测试：\nexport ALL_PROXY=socks5://127.0.0.1:1080\n\ncurl -s -o /dev/null -w \"HTTP %{http_code}, 耗时 %{time_total}s\" https://www.google.com\necho ''\ncurl -s -o /dev/null -w \"HTTP %{http_code}, 耗时 %{time_total}s\" https://www.youtube.com\necho ''\ncurl -s -o /dev/null -w \"HTTP %{http_code}, 耗时 %{time_total}s\" https://api.openai.com\n\nunset ALL_PROXY"},
    {label:"Cloudflare Tunnel 状态",instr:"检查隧道连通性。",prompt:"# 检查 cloudflared 容器：\ndocker ps --filter name=cloudflared --format \"{{.Names}} {{.Status}}\"\ndocker logs --tail 10 cloudflared 2>&1 | grep -i \"error\\|warring\\|connected\"\n\n# 测试公网访问：\ncurl -s -o /dev/null -w \"%{http_code}\" https://iptv.diynets.xyz/"},
  ]},
  {icon:"🔗",name:"MCP Server 部署",desc:"安装 → 配置 → 测试 → 集成",color:"#dc2626",steps:[
    {label:"准备 MCP Server 配置",instr:"获取 MCP Server 的安装命令和配置。",prompt:"MCP Server 信息：\n- 名称：[server 名]\n- 包管理器：[npx / pip / uvx]\n- 包名：[package name]\n- 需要的 Key/Token：[如果有]\n- API 地址：[endpoint]\n\n准备就绪后告诉 Hermes 开始部署。"},
    {label:"安装 MCP Server",instr:"执行安装命令。",prompt:"# 常见安装方式：\n# npx: npx -y [包名]\n# pip: pip install [包名]\n# uvx: uvx [包名]\n\n部署配置：\n{\n  \"mcpServers\": {\n    \"[server名]\": {\n      \"command\": \"[命令]\",\n      \"args\": [\"[参数]\"],\n      \"env\": {\n        \"API_KEY\": \"[key]\"\n      }\n    }\n  }\n}"},
    {label:"测试连接",instr:"确认 MCP Server 能正常响应。",prompt:"# 测试 MCP Server 是否正常运行：\n[执行测试命令]\n\n# 检查：\n# 1. 连接是否成功建立\n# 2. 工具/资源列表是否正常返回\n# 3. 是否有权限错误\n# 4. 版本是否兼容"},
    {label:"集成到 Hermes",instr:"让 Hermes 识别并使用新 MCP Server。",prompt:"# 将 MCP 配置添加到 Hermes：\n# 编辑 ~/.hermes/config.yaml 或使用 Hermes 命令\n# 添加后让 Hermes 重新加载配置\n\n# 测试集成：\n\"用刚部署的 [Server名] MCP Server 执行 [测试任务]\"\n\n# 检查是否能正常调用工具并返回结果"},
  ]},
  {icon:"🩺",name:"Pi5 系统健康检查",desc:"CPU → 内存 → 磁盘 → Docker → 温度",color:"#65a30d",steps:[
    {label:"基础系统状态",instr:"检查 CPU、负载、运行时间。",prompt:"echo \"=== CPU ===\"\ntop -bn1 | head -5\necho \"=== 负载 ===\"\nuptime\necho \"=== 内存 ===\"\nfree -h\necho \"=== 温度 ===\"\nvcgencmd measure_temp\ncat /sys/class/thermal/thermal_zone*/temp 2>/dev/null | awk '{print $1/1000\"°C\"}'"},
    {label:"磁盘与存储",instr:"检查磁盘使用情况。",prompt:"echo \"=== 磁盘 ===\"\ndf -h\necho \"=== Docker 磁盘 ===\"\ndocker system df\necho \"=== 大目录 ===\"\ndu -sh /home/pi5/*/ 2>/dev/null | sort -rh | head -10\necho \"=== 日志大小 ===\"\ndu -sh /home/pi5/.hermes/logs/ 2>/dev/null\ndu -sh /var/log/ 2>/dev/null"},
    {label:"Docker 与服务",instr:"检查容器和系统服务状态。",prompt:"echo \"=== Docker 容器 ===\"\ndocker ps -a --format \"table {{.Names}}\\t{{.Status}}\"\necho \"=== 关键系统服务 ===\"\nfor svc in omniroute-desktop sshd docker; do\n  echo -n \"$svc: \"\n  sudo systemctl is-active $svc\ndone\necho \"=== 监听端口 ===\"\nss -tlnp | grep -E \"8123|5180|8080|1935\""},
    {label:"报告与建议",instr:"汇总发现并记录。",prompt:"报告模板：\n```\n# Pi5 健康检查 - $(date +%Y-%m-%d)\n\n## 系统概览\n- CPU 负载：[值]\n- 内存：已用/总量\n- 磁盘：已用/总量\n- 温度：[值]°C\n\n## 容器状态\n- 运行：[N] / 异常：[M]\n\n## 问题与建议\n1. [问题] → [建议]\n```\n\n保存到：~/hermes-workspace/reports/pi5-health-$(date +%Y%m%d).md"},
  ]},
];

let activeWf = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add('copied'); btn.textContent = '✓ 已复制';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 复制'; }, 2000);
    showToast('已复制');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('已复制');
  }
}

function renderWorkflows() {
  const grid = document.getElementById('wfGrid');
  grid.innerHTML = WORKFLOWS.map((wf, i) =>
    `<div class="wf-card${activeWf===i?' active':''}" data-idx="${i}">
      <div class="wf-icon" style="background:${wf.color}20;color:${wf.color}">${wf.icon}</div>
      <div class="wf-info">
        <div class="wf-name">${wf.name}</div>
        <div class="wf-desc">${wf.desc}</div>
      </div>
      <div class="wf-steps-count">${wf.steps.length} 步</div>
      <div class="wf-arrow">›</div>
    </div>`
  ).join('');

  grid.querySelectorAll('.wf-card').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      activeWf = idx;
      renderWorkflows();
      showWorkflow(idx);
    });
  });
}

function showWorkflow(idx) {
  const wf = WORKFLOWS[idx];
  const detail = document.getElementById('detail');
  const hint = document.getElementById('startHint');
  hint.style.display = 'none';
  detail.classList.add('visible');

  document.getElementById('detailTitle').textContent = wf.icon + ' ' + wf.name;
  document.getElementById('detailDesc').textContent = wf.desc;

  const prog = document.getElementById('progress');
  const doneSteps = new Set(JSON.parse(localStorage.getItem('wf_done_'+idx)||'[]'));
  prog.innerHTML = wf.steps.map((_, i) =>
    `<div class="prog-dot${doneSteps.has(i)?' done':''}${i===doneSteps.size?' current':''}"></div>`
  ).join('') + `<span class="prog-label">${doneSteps.size}/${wf.steps.length}</span>`;

  const container = document.getElementById('stepsContainer');
  container.innerHTML = wf.steps.map((s, i) =>
    `<div class="step${i===doneSteps.size?' current-step':''}">
      <div class="step-header">
        <span class="step-num">步骤 ${i+1}/${wf.steps.length}</span>
        <span class="step-label">${s.label}</span>
      </div>
      <div class="step-instr">${s.instr}</div>
      <div class="prompt-box">${s.prompt}</div>
      <button class="copy-btn" data-step="${i}">📋 复制</button>
      <button class="run-btn" data-step="${i}">▶ 执行</button>
      <div class="result-box" id="result${i}"></div>
      ${doneSteps.has(i) ? '<span style="font-size:11px;color:#34c759;margin-left:8px">✓ 已完成</span>' :
        `<button class="done-btn" data-step="${i}" style="display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #34c759;background:#f0fff4;color:#34c759;margin-left:6px">✓ 标记完成</button>`}
    </div>`
  ).join('');

  container.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const stepIdx = parseInt(btn.dataset.step);
      copyText(wf.steps[stepIdx].prompt, btn);
    });
  });

  container.querySelectorAll('.done-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const stepIdx = parseInt(btn.dataset.step);
      const done = JSON.parse(localStorage.getItem('wf_done_'+idx)||'[]');
      if (!done.includes(stepIdx)) {
        done.push(stepIdx);
        localStorage.setItem('wf_done_'+idx, JSON.stringify(done));
        showWorkflow(idx);
        showToast('步骤已标记完成');
      }
    });
  });

  container.querySelectorAll('.run-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const stepIdx = parseInt(btn.dataset.step);
      const prompt = wf.steps[stepIdx].prompt;
      const resultBox = document.getElementById('result'+stepIdx);
      btn.disabled = true; btn.classList.add('running'); btn.textContent = '⏳ 执行中';
      resultBox.className = 'result-box visible loading';
      resultBox.innerHTML = '<div class="r-hdr"><span>⏳ AI 响应中...</span></div>';
      try {
        const r = await fetch('/api/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({prompt, system: '你是一个实用的系统运维和技术助手。用中文回答，先给结论再给步骤。回答要简洁，可以直接执行的命令用代码块标出。'}),
          signal: AbortSignal.timeout(120000)
        });
        const data = await r.json();
        resultBox.className = 'result-box visible';
        resultBox.innerHTML = '<div class="r-hdr"><span>✅ AI 回复</span><span class="r-close">✕</span></div><div>' + data.reply.replace(/\n/g,'<br>').replace(/```/g,'<br>') + '</div>';
      } catch(e) {
        resultBox.className = 'result-box visible';
        resultBox.innerHTML = '<div class="r-hdr"><span style="color:#ff3b30">⚠️ 错误</span><span class="r-close">✕</span></div><div>' + e.message + '</div>';
      }
      btn.disabled = false; btn.classList.remove('running'); btn.textContent = '▶ 执行';
    });
  });

  // Close result boxes
  container.querySelectorAll('.r-close').forEach(el => {
    el.addEventListener('click', () => el.closest('.result-box').className = 'result-box');
  });

  detail.scrollIntoView({behavior:'smooth', block:'start'});
}

renderWorkflows();
</script>
</body>
</html>
