<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hermes Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1d1d1f;height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.navbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid #e5e5ea;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav-sub{font-size:12px;color:#86868b}
.msg-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;animation:fadeUp .25s;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#007aff;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.ai{background:#fff;color:#1d1d1f;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #e5e5ea}
.msg.system{background:transparent;color:#86868b;align-self:center;font-size:12px;padding:4px 8px}
.msg .time{font-size:10px;opacity:.6;margin-top:4px}
.msg .copy-link{font-size:11px;color:var(--accent,#007aff);cursor:pointer;margin-top:4px;display:inline-block}
.msg .copy-link:hover{text-decoration:underline}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{display:flex;align-items:center;gap:4px;padding:16px 18px}
.typing .dot{width:6px;height:6px;border-radius:50%;background:#aeaeb2;animation:bounce 1.4s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.input-bar{flex-shrink:0;padding:12px 16px;background:#fff;border-top:1px solid #e5e5ea;display:flex;gap:10px;align-items:flex-end}
.input-bar textarea{flex:1;border:1.5px solid #e5e5ea;border-radius:20px;padding:10px 16px;font-size:14px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.5;transition:.2s;background:#fafafa}
.input-bar textarea:focus{border-color:#007aff;background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,.08)}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:#007aff;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.send-btn:hover{background:#0066d6}
.send-btn:disabled{background:#c7c7cc;cursor:not-allowed}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:#aeaeb2;font-size:14px;flex-direction:column;gap:8px}
.empty-state .big{font-size:40px;opacity:.3}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:300;opacity:0;transition:.35s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-title">💬 Hermes Chat</div>
  <button class="nav-sub" id="clearBtn" style="background:none;border:none;cursor:pointer;color:#86868b;font-size:12px">清空</button>
</div>

<div class="msg-area" id="msgArea">
  <div class="empty-state" id="emptyState">
    <div class="big">💬</div>
    <div>给 Hermes 发消息</div>
  </div>
</div>

<div class="input-bar">
  <textarea id="input" rows="1" placeholder="输入消息..." maxlength="4000"></textarea>
  <button class="send-btn" id="sendBtn">↑</button>
</div>

<div class="toast" id="toast"></div>

<script>
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const msgArea = document.getElementById('msgArea');
const emptyState = document.getElementById('emptyState');
const toast = document.getElementById('toast');

const STORAGE_KEY = 'hermes_chat_history';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch { return []; }
}
function saveHistory(msgs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-100)));
}

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}

function scrollBottom() {
  msgArea.scrollTop = msgArea.scrollHeight;
}

function timeStr() {
  return new Date().toLocaleString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}

function addMsg(role, text, isHistory) {
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'ai') {
    div.innerHTML = text.replace(/\n/g,'<br>') +
      '<div class="copy-link" onclick="copyMsg(this)">📋 复制</div>' +
      '<div class="time">' + timeStr() + '</div>';
  } else if (role === 'user') {
    div.textContent = text;
    div.innerHTML += '<div class="time">' + timeStr() + '</div>';
  }
  msgArea.appendChild(div);
  if (!isHistory) scrollBottom();
}

function renderHistory() {
  msgArea.innerHTML = '';
  const msgs = loadHistory();
  if (!msgs.length) {
    emptyState.style.display = 'flex';
    return;
  }
  msgs.forEach(m => addMsg(m.role, m.text, true));
  scrollBottom();
}

function copyMsg(el) {
  const text = el.parentElement.textContent.replace('📋 复制','').replace(/^\d{2}:\d{2}$/,'').trim();
  navigator.clipboard.writeText(text).then(() => showToast('已复制'));
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;

  // user message
  addMsg('user', text);
  const history = loadHistory();
  history.push({role:'user', text, time: timeStr()});
  saveHistory(history);

  // typing indicator
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai typing';
  typingDiv.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  msgArea.appendChild(typingDiv);
  scrollBottom();

  try {
    const r = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: text}),
      signal: AbortSignal.timeout(180000)
    });
    const data = await r.json();
    typingDiv.remove();

    addMsg('ai', data.reply);
    history.push({role:'ai', text: data.reply, time: timeStr()});
    saveHistory(history);
  } catch(e) {
    typingDiv.remove();
    addMsg('ai', '⚠️ 错误：' + e.message);
  }
  sendBtn.disabled = false;
  input.focus();
}

// auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', send);

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('清空所有聊天记录？')) {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  }
});

renderHistory();
</script>
</body>
</html>
