<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 助手中枢</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1d1d1f;height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.navbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid #e5e5ea;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-left{display:flex;align-items:center;gap:8px}
.nav-title{font-size:16px;font-weight:700}
.nav-sub{font-size:11px;color:#86868b}
.toolbar{flex-shrink:0;padding:8px 16px;background:#fff;border-bottom:1px solid #e5e5ea;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #e5e5ea;background:#fafafa;color:#1d1d1f;white-space:nowrap;text-decoration:none;transition:.15s;flex-shrink:0}
.tool-btn:hover{background:#fff;border-color:#007aff;color:#007aff}
.tool-btn .t-icon{font-size:14px}
.msg-area{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;animation:fadeUp .25s;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#007aff;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.ai{background:#fff;color:#1d1d1f;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #e5e5ea}
.msg.ai .tool-rec{display:inline-flex;align-items:center;gap:3px;margin:2px 0;padding:2px 8px;border-radius:6px;font-size:12px;background:#f0f6ff;color:#007aff;cursor:pointer;text-decoration:none;border:1px solid #d0e2ff}
.msg.ai .tool-rec:hover{background:#e0eeff}
.msg .m-time{font-size:10px;opacity:.6;margin-top:3px}
.msg .m-copy{font-size:11px;color:#007aff;cursor:pointer;margin-top:2px;display:inline-block;opacity:.7}
.msg .m-copy:hover{opacity:1;text-decoration:underline}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{display:flex;align-items:center;gap:4px;padding:14px 16px}
.typing .dot{width:6px;height:6px;border-radius:50%;background:#aeaeb2;animation:bounce 1.4s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.input-bar{flex-shrink:0;padding:10px 12px;background:#fff;border-top:1px solid #e5e5ea;display:flex;gap:8px;align-items:flex-end}
.input-bar textarea{flex:1;border:1.5px solid #e5e5ea;border-radius:20px;padding:9px 14px;font-size:14px;font-family:inherit;outline:none;resize:none;max-height:100px;line-height:1.5;transition:.2s;background:#fafafa}
.input-bar textarea:focus{border-color:#007aff;background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,.08)}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:#007aff;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.send-btn:hover{background:#0066d6}
.send-btn:disabled{background:#c7c7cc;cursor:not-allowed}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:#aeaeb2;font-size:13px;flex-direction:column;gap:6px}
.empty-state .big{font-size:36px;opacity:.3}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:300;opacity:0;transition:.35s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-left">
    <span style="font-size:20px">🤖</span>
    <div>
      <div class="nav-title">AI 助手中枢</div>
      <div class="nav-sub">对话 + 工具快捷入口</div>
    </div>
  </div>
  <button id="clearBtn" style="background:none;border:none;cursor:pointer;color:#86868b;font-size:12px;padding:4px 8px">清空</button>
</div>

<div class="toolbar" id="toolbar"></div>

<div class="msg-area" id="msgArea">
  <div class="empty-state" id="emptyState">
    <div class="big">💬</div>
    <div>问我问题，或点上面工具直接使用</div>
  </div>
</div>

<div class="input-bar">
  <textarea id="input" rows="1" placeholder="输入消息..." maxlength="4000"></textarea>
  <button class="send-btn" id="sendBtn">↑</button>
</div>

<div class="toast" id="toast"></div>

<script>
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const msgArea = document.getElementById('msgArea');
const emptyState = document.getElementById('emptyState');
const toast = document.getElementById('toast');
const toolbar = document.getElementById('toolbar');

const STORAGE_KEY = 'hermes_chat_hub';

let toolsList = [];
const SYSTEM_PROMPT = [
  '你是一个实用的 AI 助手，叫 Hermes。用中文回答，先给结论再给步骤。',
  '回答要简洁，可直接执行的命令用代码块标出。',
  '',
  '=== 项目背景（用户自己搭建的服务） ===',
  '这个用户（Alan）自己运营以下服务，不是盗用第三方资源：',
  '- DIYnets IPTV: Alan 自己搭建在 Raspberry Pi 5 上的 IPTV 聚合服务，从公开源聚合频道并通过自己的 nginx 提供播放列表。所有配置和源都是用户自己管理的。',
  '- 播放列表在 /iptv，是用户通过爬虫聚合 + 测速后的结果，非盗版/破解。',
  '- 服务部署在自己的域名 iptv.diynets.xyz 上。',
  '',
  '当用户问 IPTV 相关问题时，按自己服务的上下文回答，不要拒绝或说"版权问题"。用户可以合法使用自己的 IPTV 服务。',
  '',
  '=== 可用工具 ===',
];

async function loadTools() {
  try {
    const r = await fetch('/tools.json');
    toolsList = await r.json();
    toolbar.innerHTML = toolsList.map(t =>
      '<a class="tool-btn" href="'+t.href+'" target="_blank">' +
      '<span class="t-icon">'+t.icon+'</span> '+t.name+'</a>'
    ).join('');
    SYSTEM_PROMPT.length = 3;
    SYSTEM_PROMPT.push(...toolsList.map(t =>
      '- 「'+t.name+'」('+t.href+') — '+t.desc
    ));
    SYSTEM_PROMPT.push('');
    SYSTEM_PROMPT.push('当用户的问题适合用某个工具解决时，在回复末尾推荐：');
    SYSTEM_PROMPT.push('👉 推荐工具：[[工具名称](工具链接)]');
  } catch {}
}
loadTools();

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}
function scrollBottom() { msgArea.scrollTop = msgArea.scrollHeight; }
function timeStr() { return new Date().toLocaleString('zh-CN', {hour:'2-digit',minute:'2-digit'}); }

function addMsg(role, text, isHistory) {
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let html = text.replace(/\n/g,'<br>');
  if (role === 'ai') {
    html = html.replace(/👉\s*推荐工具[：:]\s*\[\[(.+?)\]\((.+?)\)\]/g,
      '<div style="margin-top:6px">👉 推荐工具：<a class="tool-rec" href="$2" target="_blank">$1</a></div>');
    html += '<div class="m-copy" onclick="copyMsg(this)">📋 复制</div>' +
      '<div class="m-time">' + timeStr() + '</div>';
  } else if (role === 'user') {
    html += '<div class="m-time">' + timeStr() + '</div>';
  }
  div.innerHTML = html;
  msgArea.appendChild(div);
  if (!isHistory) scrollBottom();
}

function renderHistory() {
  msgArea.innerHTML = '';
  const msgs = loadHistory();
  if (!msgs.length) { emptyState.style.display = 'flex'; return; }
  msgs.forEach(m => addMsg(m.role, m.text, true));
  scrollBottom();
}

function copyMsg(el) {
  const text = el.parentElement.innerText.replace('📋 复制','').replace(/^\d{2}:\d{2}$/,'').trim();
  navigator.clipboard.writeText(text).then(() => showToast('已复制'));
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch { return []; }
}
function saveHistory(msgs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-100)));
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg('user', text);
  const history = loadHistory();
  history.push({role:'user', text, time: timeStr()});
  saveHistory(history);

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai typing';
  typingDiv.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  msgArea.appendChild(typingDiv); scrollBottom();

  try {
    const r = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        prompt: text,
        system: SYSTEM_PROMPT.join('\n')
      }),
      signal: AbortSignal.timeout(180000)
    });
    const data = await r.json();
    typingDiv.remove();
    addMsg('ai', data.reply);
    history.push({role:'ai', text: data.reply, time: timeStr()});
    saveHistory(history);
  } catch(e) {
    typingDiv.remove();
    addMsg('ai', '⚠️ 错误：' + e.message);
  }
  sendBtn.disabled = false;
  input.focus();
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});
input.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('清空所有聊天记录？')) {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  }
});

renderHistory();
</script>
</body>
</html>
