<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hermes 新手助手</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(13,17,23,.9);backdrop-filter:blur(14px);border-bottom:1px solid #21262d}
a{color:inherit}.back,.chat{padding:8px 12px;border-radius:9px;text-decoration:none;font-size:13px;border:1px solid var(--line)}.chat{background:#0969da;border-color:#0969da;font-weight:650}
main{max-width:780px;margin:auto;padding:28px 16px 60px}.hero{text-align:center;padding:10px 0 25px}.hero .icon{font-size:48px}.hero h1{margin:8px 0 4px;font-size:26px}.hero p{margin:0;color:var(--muted);font-size:14px}.safe{margin:16px auto 0;max-width:600px;padding:10px 13px;border:1px solid rgba(63,185,80,.4);background:rgba(63,185,80,.08);border-radius:10px;color:#7ee787;font-size:13px}
.section-title{font-size:15px;margin:24px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;display:flex;flex-direction:column;gap:9px}.card h2{font-size:15px;margin:0}.card p{font-size:12px;color:var(--muted);margin:0;min-height:38px}.actions{display:flex;gap:7px;margin-top:auto}.btn{border:1px solid var(--line);background:#21262d;color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px;cursor:pointer;flex:1}.btn.primary{background:#1f6feb;border-color:#1f6feb}.btn:hover{filter:brightness(1.12)}
.custom{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}textarea{width:100%;min-height:90px;resize:vertical;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;font-size:14px;outline:none}textarea:focus{border-color:var(--blue)}.tip{font-size:12px;color:var(--muted);margin-top:8px}.warn{color:#ffa198}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#e6edf3;color:#0d1117;padding:9px 15px;border-radius:999px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){main{padding-top:18px}.grid{grid-template-columns:1fr}.hero h1{font-size:22px}}
</style>
</head>
<body>
<header><a class="back" href="/">← 首页</a><strong>Hermes 新手助手</strong><a class="chat" href="/chat">打开对话</a></header>
<main>
<section class="hero"><div class="icon">🤖</div><h1>不会提问，也可以使用 Hermes</h1><p>选择一个常用功能，问题会自动填入 Hermes Chat。中文、英文、错字都没问题。</p><div class="safe">🛡️ 模板默认要求先检查、简单解释；危险操作必须先询问你。</div></section>
<h2 class="section-title">常用功能</h2>
<div class="grid" id="cards"></div>
<h2 class="section-title">不知道选哪个？</h2>
<section class="custom"><textarea id="custom" placeholder="贴上错误文字，或只写几个词，例如：HA 离线、看这个目录、不知道下一步"></textarea><div class="actions" style="margin-top:9px"><button class="btn" id="copyCustom">复制安全提问</button><button class="btn primary" id="openCustom">自动填入 Chat</button></div><div class="tip">生成内容会自动加入：请先理解我的意思；不确定时先只读；用简单中文回答。</div></section>
<p class="tip warn">⚠️ 不要粘贴密码、Token、验证码或完整摄像头地址。</p>
</main>
<div class="toast" id="toast">已复制，可以粘贴到 Hermes Chat</div>
<script>
const items=[
['🟢','查看目前状态','检查 Pi5、Hermes 和主要服务是否正常。','请检查目前状态。先只读检查，不要修改。用简单中文告诉我：状态、问题、下一步。'],
['🧭','告诉我下一步','不知道接下来应该做什么时使用。','请根据目前情况告诉我下一步。只给最实用的一个建议，先不要修改任何内容。'],
['🧯','帮我看错误','把错误文字或截图发给 Hermes。','我看不懂这个错误。请先解释它是什么意思，再只读检查原因；不要修改，危险操作先问我。'],
['📂','读取一个目录','查看文件夹结构，不改变文件。','请读取我提供的目录，说明里面有什么。只读检查，不修改、不安装、不启动服务。'],
['🏠','检查智能家居','检查 Home Assistant、MQTT、Zigbee2MQTT 和 go2rtc。','请只读检查智能家居服务状态和近期错误。不要重启、不要改配置，给我简单结论。'],
['🧹','整理项目建议','先分析目录，再提出整理方案。','请先只读分析这个项目，告诉我哪些需要整理。不要移动、删除或覆盖文件，等我确认。'],
['📖','解释给新手','让 Hermes 用更简单的话重新说明。','我没有看懂。请用新手能理解的简单中文重新解释，一次只说一个步骤。'],
['🛡️','安全执行任务','需要修改时使用的安全模板。','请完成这个任务。修改前先备份；说明风险和回滚方法；危险操作等我确认；完成后实际验证。']
];
const cards=document.getElementById('cards'),toast=document.getElementById('toast');
function notify(){toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1800)}
async function copy(text){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}notify()}
const chatUrl=prompt=>'/chat/?prompt='+encodeURIComponent(prompt);
const customPrompt=()=>{const text=document.getElementById('custom').value.trim()||'我不知道怎么描述这个问题。请先问我最重要的一个问题。';return `这是我的问题：${text}\n\n请先理解我的大概意思。中文或用词不准确时不要责怪我；有歧义先复述。默认只读检查，不要修改。请用简单中文回答，一次只给一个步骤。`};
items.forEach(([icon,title,desc,prompt])=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<h2>${icon} ${title}</h2><p>${desc}</p><div class="actions"><button class="btn">复制提问</button><a class="btn primary" style="text-align:center;text-decoration:none" href="${chatUrl(prompt)}">自动填入 Chat</a></div>`;el.querySelector('button').onclick=()=>copy(prompt);cards.appendChild(el)});
document.getElementById('copyCustom').onclick=()=>copy(customPrompt());
document.getElementById('openCustom').onclick=()=>location.href=chatUrl(customPrompt());
</script>
</body>
</html>
