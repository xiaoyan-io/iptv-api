[Settings]
; =========================
; Myanmar Sports User Config
; =========================

# 使用缅甸体育频道模板
source_file = config/myanmar_sports.txt
# 输出文件
final_file = output/myanmar_sports_result.txt
# 缅甸时区
time_zone = Asia/Yangon
# EPG 开启
open_epg = True
# M3U 输出开启
open_m3u_result = True
# 开启测速（选最快源）
open_speed_test = True
# 最小分辨率 480p（适应免费源）
min_resolution = 640x480
# 最小速率 0.2 M/s（适应缅甸网络环境）
min_speed = 0.2
# 分辨率与速率映射（低门槛）
resolution_speed_map = 640x480:0.1,1280x720:0.2,1920x1080:0.5,3840x2160:1.0
# 单个频道接口数量
urls_limit = 5
# IPv6 默认关闭
ipv6_support = False
ipv_type = ipv4
ipv_type_prefer = ipv4
# 关闭全量测速（减少不必要的测速）
open_full_speed_test = False
# 开启补偿机制（保留多个备用线路）
open_supply = True
# 关闭未匹配频道分类（只输出模板中的频道）
open_unmatch_category = False
# 关闭无结果频道分类
open_empty_category = False
# 关闭 RTMP 推流（不消耗本机带宽/CPU）
open_rtmp = False
# 测速超时降低，更快扫描
speed_test_timeout = 5
# 公网协议
public_scheme = https
# 公网域名（Cloudflare Tunnel）
public_domain = iptv.diynets.xyz
# 语言
language = zh_CN
